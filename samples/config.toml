# nando per-user configuration.
# Copy this file to ${XDG_CONFIG_HOME:-~/.config}/nando/config.toml. nando,
# nando-fuse, and nando-webdav all read this same per-user file; each accepts
# --config/-config to select an alternate file.
# Uncomment only the settings you need. Command-line flags take precedence.

# Local repository directory. Actual default: empty (use the default data
# directory). This is the filesystem path for the repository, not a logical
# directory inside nando.
[repository]
# path = "/home/alex/nando-data"

# Enable diagnostic logging. Actual default: false.
[logging]
# verbose = false

# Remote delivery scheduler policy. These are examples, not defaults.
# Remote repositories require all four values. Durations must be positive.
# Local repositories can also use these values to schedule maintenance.
[remote]
# GCS or S3-compatible URI, for example "gs://bucket/archive/" or
# "s3://bucket/archive/". The literal prefix preserves trailing slashes and
# no separator is inserted. When set, it must match the URI persisted at init.
# remote_uri = "s3://my-nando-bucket/archive/"
# For Wasabi or custom S3-compatible endpoints; omit endpoint for AWS S3.
# endpoint = "https://s3.us-west-1.wasabisys.com"
# region = "us-west-1"
# Optional static credentials; otherwise the AWS credential chain is used.
# access_key_id = "..."
# secret_access_key = "..."
# session_token = "..."
# sync_idle_interval = "30s"
# sync_periodic_interval = "5m"
# max_delivery_delay = "30m"
# sync_parallelism = 2

# Daemon transport and credentials. `listen` configures both the daemon's
# listening address and the address all client commands connect to, including
# FUSE and WebDAV. If omitted, both use the repository-specific local Unix
# socket. The values below are illustrative.
# WebDAV's [webdav].listen / --webdav-listen remain its separate HTTP bind address.
# TCP listeners require TLS and bearer auth; configure the matching client
# token source and CA certificate where needed.
[daemon]
# listen = "tcp://127.0.0.1:7443"

# Select at most one token source. Uncomment exactly one line when using TCP.
# These three settings are mutually exclusive, even when an empty value is set.
# token = "replace-with-a-secret"       # Example literal token value.
# token_from_file = "/etc/nando/token"  # Example path containing the token.
# token_from_env = "NANDO_DAEMON_TOKEN" # Example environment variable name.

# CA certificate used by clients to verify a private server certificate.
# ca_cert = "/etc/nando/ca.pem"

# Server certificate and private key read by `nando daemon` for TCP TLS.
# tls_cert = "/etc/nando/server.pem"
# tls_key = "/etc/nando/server-key.pem"

# Adapter settings. CLI options override these values.
[fuse]
# mountpoint = "/mnt/nando"
# Supported mount options (all omitted by default):
# - "allow_other": allow users other than the mounting user to access the
#   mount. Requires "user_allow_other" enabled in /etc/fuse.conf.
# - "default_permissions": ask the kernel to check Unix mode bits on access.
# Values outside this supported list are rejected. CLI mount options replace
# this list; repeat --fuse-mount-option to select multiple values.
# mount_options = ["allow_other", "default_permissions"]

[webdav]
# listen = "127.0.0.1:8080"

# Logical directory inside nando for `nando admin recover` when restoring
# unreferenced GCS or S3-compatible objects. Actual default: /recyclebin. This is not the local
# repository directory configured by [repository].path.
[recovery]
# directory = "/recyclebin"
