# Optional daemon transport settings for advanced deployments.
# Leave endpoint empty to use the repository's local Unix socket.
# TCP requires TLS on the daemon and a bearer token for clients.
[daemon]
endpoint = ""

# Client authentication for a TCP daemon.
token_file = ""
ca_cert = ""

# Server TLS files, read by `nando daemon` when using TCP.
tls_cert = ""
tls_key = ""
