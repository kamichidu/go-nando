version: '3'

vars:
  BIN_DIR: .local/bin
  REPO_DIR: .local/lib/nando/repo

tasks:
  default:
    cmds:
      - task: vet
      - task: test
      - task: build

  build:
    desc: Build the nando CLI executable
    cmds:
      - go build -o {{.BIN_DIR}}/nando cmd/nando/main.go

  test:
    desc: Run unit and integration tests
    cmds:
      - go test ./...

  vet:
    desc: Run static analysis checks (go vet)
    cmds:
      - go vet ./...

  clean:
    desc: Remove built binaries and output files
    cmds:
      - rm -rf {{.BIN_DIR}}/
      - rm -rf {{.REPO_DIR}}/
