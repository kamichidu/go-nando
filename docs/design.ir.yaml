        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
  - id: IMP-CURRENT-LOCAL-GC
    level: implementation
    kind: observed-implementation
    statement: At repository revision b4dba45ae202d995c973af01154c08108e98ce1c, GC compares Metadata ReferencedObjectIDs with Local ObjectStore.List and deletes valid unreferenced IDs under Repository-wide exclusion. It has no capacity target, Local-cache eviction state, GCS enumeration/deletion, or API to delete malformed raw object names; Doctor reports malformed Local object names and checks referenced Local content while ignoring valid unreferenced content.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/repository/repository.go
        revision: b4dba45ae202d995c973af01154c08108e98e1c
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/objectstore/store.go
        revision: b4dba45ae202d995c973af01154c08108e98e1c
        role: implementation-interface
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/objectstore/local/store.go
        revision: b4dba45ae202d995c973af01154c08108e98e1c
        role: implementation-source
  - id: IMP-CURRENT-LEASE-READ-GAPS
    level: implementation
    kind: observed-implementation
    statement: At repository revision b4dba45ae202d995c973af01154c08108e98ce1c, put_leases.db persists only operation_id and expires_at. Put creates Local staging before acquiring its Lease; AcquireLease and RenewLease use the Lease database separately from Repository coordination, while Commit validates the Lease under Exclusive coordination. GC lease invalidation is coordinated, but active-Lease enumeration and staging removal are separate steps. Get and the full Cat stream hold Repository-wide Exclusive coordination through local object I/O; there are no resource-scoped content-ID or temporary-ID RWLocks and no transfer queue.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/coordinator/sqlite/coordinator.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/repository/put.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/repository/get.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/repository/repository.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
  - id: IMP-CURRENT-METADATA-SQLITE
    level: implementation
    kind: observed-implementation
    statement: At repository revision b4dba45ae202d995c973af01154c08108e98ce1c, MetadataStore is implemented by SQLite schema migration version 1 with entries, repository_format, and schema_migrations tables. SQLite performs state-dependent Create, Update, Move, and Delete checks in backend transactions; the public MetadataStore interface exposes semantic operations rather than SQL transaction types. There is no Firestore adapter or transfer-state schema.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/metadata/store.go
