open_items:
  - id: OPEN-SHA1-FORMAT-TRANSITION
    statement: Decide how repositories with current plain SHA-1 identifiers transition to the Phase 1 SHA-256 algorithm-namespaced format without silently reinterpreting existing IDs.
    status: open
    related_refs: [DES-IDENTITY-TARGET, IMP-CURRENT-SHA1]
  - id: OPEN-READ-REVISION-CHANGE
    statement: Decide whether a Read that observes an Entry revision change during streaming returns the already opened content or retries before exposing bytes; preserve Read/GC exclusion independently of this policy.
    status: open
    related_refs: [DES-READ-SEMANTICS, REQ-READ-GC-EXCLUSION]
  - id: OPEN-PATH-CACHE-UPDATE
    statement: Decide whether a derived canonical path cache is synchronously updated, invalidated for later recalculation, or lazily rebuilt after Entry moves and renames.
    status: open
    related_refs: [DES-EXPLICIT-DIRECTORY-MODEL]
  - id: OPEN-DELETE-RETENTION
    statement: Decide whether removed Entries are represented as tombstones, physically removed, or compacted, and define any retention policy without changing committed namespace visibility semantics.
    status: open
    related_refs: [DES-EXPLICIT-DIRECTORY-MODEL]
  - id: OPEN-GCS-GENERATION-AND-BUCKET-POLICY
    statement: GCS generation and required API metadata are retained for upload reconciliation and observation. Define behavior under bucket versioning, soft delete, retention, external overwrite/delete, bucket/prefix changes, and object recreation, including how noncurrent generations affect recovery. Arbitrary external GCS corruption is not guaranteed to be detected.
    status: open
    related_refs: [REQ-GCS-PUBLICATION, REQ-LOCAL-GCS-IMMUTABILITY, DES-GC-CLASSES]
  - id: OPEN-READ-FAILURE-AND-DOCTOR-SEMANTICS
    statement: Define Doctor health in Remote mode when Local cache is missing/corrupt, remote delivery remains pending, or the selected remote Object is missing/corrupt; distinguish valid unreferenced content from invalid orphans without making Doctor destructive. Cat may have written a response prefix before writer failure. A read 404 after external GCS object removal is a localized read error and does not change Metadata; revision-change policy remains independent from GC safety.
    status: open
    related_refs: [REQ-READ-THROUGH, REQ-DOCTOR-NONDESTRUCTIVE, DES-DOCTOR, DES-GCS-READ-THROUGH, OPEN-READ-REVISION-CHANGE]
  - id: OPEN-DELIVERY-MODE-MIGRATION
    statement: Existing repositories using delivery_mode=gcs and gcs_bucket remain readable and are interpreted as Remote mode with GCS selected. New repository settings use delivery_mode=remote, remote_backend=gcs, and remote_bucket. Existing per-user TOML keys gcs_sync_idle_interval, gcs_sync_periodic_interval, gcs_max_delivery_delay, and gcs_sync_parallelism remain accepted; generic remote_sync_* keys are canonical. CLI --delivery-mode gcs and --gcs-bucket remain aliases. Opening an existing repository does not rewrite its settings or change its backend. Remote-to-Local conversion, bucket changes, rollback across binary versions, and Local-to-Remote prefill are not performed automatically and remain explicit operator decisions.
    status: resolved
    related_refs: [DES-CONSTRUCTION, DES-DELIVERY-MODES, DES-PHASE1-FORMAT, REQ-REMOTE-BACKEND-SELECTION]
  - id: OPEN-FIRESTORE-COORDINATION-AND-SNAPSHOT
    statement: Define the deployment boundary for a Firestore MetadataStore behind MetadataStore semantics. The current SQLite Coordinator and Resource Lease store coordinate processes sharing one local repository path; decide whether Firestore is limited to that single-host deployment or requires a shared distributed Coordinator and a consistent ReferencedObjectIDs snapshot/conditional GC contract across hosts and writers. The MetadataStore adapter must retain atomic Put-and-enqueue and queue-row deletion semantics.
    status: open
    related_refs: [REQ-METADATA-PORTABILITY, REQ-PUT-GC-EXCLUSION, REQ-READ-GC-EXCLUSION, DES-METADATA-BACKEND-PORTABILITY, DES-REPOSITORY-BOUNDARIES]
  - id: OPEN-METADATA-BACKUP-PROCEDURE
    statement: "Resolved by the Phase A operator runbook: quiesce FUSE/WebDAV, normally stop the daemon, and capture every Repository component as one consistent set while all Repository writes have ceased. Preserve SQLite and any sidecars, coordination DB, Local CAS objects, Recovery staging/manifests, repository settings, and pending GCS obligations. Restore the complete set while stopped with owner/mode/configuration checks; do not require GCS queue drain or prescribe a snapshot technology. External credentials and unit/configuration files remain separately managed. Version 2 Recovery manifests store Repository-root-relative staging paths and resolve them under the current root. Version 1 absolute paths are never followed; migration requires the expected current-root stage for the same session ID to exist as a regular file, otherwise startup reports an explicit error."
    status: resolved
    related_refs: [REQ-METADATA-BACKUP-RESPONSIBILITY, DES-METADATA-BACKEND-PORTABILITY, DES-REPLICATION-STATE]
  - id: OPEN-ADAPTER-AUTHORIZATION
    statement: "The user-approved Phase A decision is single-user local-host operation: daemon Unix sockets use OS permissions with a private 0700 parent and 0600 socket; WebDAV is unauthenticated plain HTTP bound only to loopback; external exposure, multiple-user authorization, WebDAV client authentication, and WebDAV TLS termination are deferred. WebDAV If-Match and If-None-Match use ETags from the Begin-time CAS snapshot, and unsupported conditional headers are rejected. Standard Phase A operation uses UDS; the existing optional TCP listener still requires TLS and bearer authentication, but TCP bind, certificate trust/rotation, token provisioning/rotation, and per-method authorization are not standard Phase A acceptance items. This open item tracks only decisions needed if a future phase expands beyond the approved boundary. ADC supplies GCS credentials only and is not client authorization."
    status: open
    related_refs: [DES-DAEMON-RUNTIME, DES-ADAPTERS-FILESYSTEM]
  - id: OPEN-PHASE-B-PUBLISH-ATOMICITY
    statement: Define Phase B's exact transaction and recovery model for a daemon-local pending version, shared Published Head, GCS delivery confirmation, concurrent publishers, version retention, and Metadata/object GC snapshots. A shared Metadata backend must not expose an un-published local revision or remove the previous Published Head before the new one is globally durable.
    status: open
    related_refs: [DES-LOCAL-COMMIT-GLOBAL-PUBLISH, DES-PHASE-B-PUBLISHED-HEAD, REQ-REPLICATION-OBLIGATION, REQ-LOCAL-CAPACITY-GC]
  - id: OPEN-GCS-SCHEDULER-DEFAULTS
    statement: All synchronization timing and parallelism are configurable. Select operational defaults, whether idle means no repository writes or no dirty handles, and the behavior when continuous writes defer idle sync until maximum delivery delay.
    status: open
    related_refs: [DES-GCS-SYNC-SCHEDULING, DES-MAINTENANCE-JOB]
