  - id: IMP-CURRENT-METADATA-SQLITE
    level: implementation
    kind: observed-implementation
    statement: At repository revision 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64, MetadataStore is implemented by SQLite schema migration version 1 with entries, repository_format, and schema_migrations tables. SQLite performs state-dependent Create, Update, Move, and Delete checks in backend transactions; the public MetadataStore interface exposes semantic operations rather than SQL transaction types. There is no Firestore adapter or transfer-state schema.
    provenance:
      origin: observed
    artifact_refs:
