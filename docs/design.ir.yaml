        role: implementation-source
  - id: IMP-CURRENT-LOCAL-GC
    level: implementation
    kind: observed-implementation
    statement: At repository revision 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64, GC compares Metadata ReferencedObjectIDs with Local ObjectStore.List and deletes valid unreferenced IDs under Repository-wide exclusion. It has no capacity target, Local-cache eviction state, GCS enumeration/deletion, or API to delete malformed raw object names; Doctor reports malformed Local object names and checks referenced Local content while ignoring valid unreferenced content.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/04f4e8991f0f7cd12c87a01fcd5a690558e5cf64/internal/repository/repository.go
        revision: 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/04f4e8991f0f7cd12c87a01fcd5a690558e5cf64/internal/objectstore/store.go
        revision: 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64
        role: implementation-interface
      - uri: https://github.com/kamichidu/go-nando/blob/04f4e8991f0f7cd12c87a01fcd5a690558e5cf64/internal/objectstore/local/store.go
        revision: 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64
        role: implementation-source
  - id: IMP-CURRENT-LEASE-READ-GAPS
    level: implementation
    kind: observed-implementation
    statement: At repository revision 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64, put_leases.db persists only operation_id and expires_at. Put creates Local staging before acquiring its Lease; AcquireLease and RenewLease use the Lease database separately from Repository coordination, while Commit validates the Lease under Exclusive coordination. GC lease invalidation is coordinated, but active-Lease enumeration and staging removal are separate steps. Get and the full Cat stream hold Repository-wide Exclusive coordination through local object I/O; there are no resource-scoped content-ID or temporary-ID RWLocks and no transfer queue.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/04f4e8991f0f7cd12c87a01fcd5a690558e5cf64/internal/coordinator/sqlite/coordinator.go
        revision: 04f4e8991f0f7cd12c87a01fcd5a690558e5cf64
        role: implementation-source
