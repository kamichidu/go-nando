contract_version: 1alpha1
schema_ref:
  revision: 455ed318b7bc409d3e1da320620ef92d457042b9
  sha256: 9b109dbc7ac09b32d3dbe2e233eed7da1378bc912d0e84c479c3ed0bed9f7103
model:
  id: go-nando
  title: go-nando repository design
  description: Canonical semantic design for repository authority, storage contracts, operation consistency, failure outcomes, and implementation roadmap.
  domain: file repository
  profile: repository-system-design
nodes:
  - id: REQ-META-SSOT
    level: system_requirement
    kind: authority-invariant
    statement: The Metadata Store MUST be the sole source of truth for committed Entries and the logical namespace; object presence or layout MUST NOT determine logical visibility.
    provenance:
      origin: imported
  - id: REQ-META-COMMITTED-ONLY
    level: system_requirement
    kind: persistence-invariant
    statement: The Metadata Store MUST persist committed Entries only and MUST NOT persist Pending Entries or other in-progress Repository operation state.
    provenance:
      origin: imported
  - id: REQ-OBJECT-SSOT
    level: system_requirement
    kind: authority-invariant
    statement: The Object Store MUST own immutable bytes identified by each content ID. Local mode uses Local Object Storage as its durable authority. Remote mode uses Local durable staging/cache and exactly one selected remote object-storage backend; remote placement MUST NOT determine logical Entry visibility, which remains Metadata Store authority.
    provenance:
      origin: imported
  - id: REQ-OBJECT-COMMIT
    level: system_requirement
    kind: commit-invariant
    statement: A successful Object Store Commit MUST atomically publish a complete immutable Object, and subsequent Open MUST read it while Exists MUST report it present.
    provenance:
      origin: imported
  - id: REQ-METADATA-ORDER
    level: system_requirement
    kind: commit-invariant
    statement: Repository metadata MUST NOT commit a reference to an Object before that Object has successfully committed.
    provenance:
      origin: imported
  - id: REQ-REVISION
    level: system_requirement
    kind: version-invariant
    statement: Entry revisions MUST be initialized to a valid uint64 value at creation and MUST increase monotonically after successful writes affecting that Entry, without requiring an exact increment size.
    provenance:
      origin: imported
  - id: REQ-PUT-GC-EXCLUSION
    level: system_requirement
    kind: concurrency-invariant
    statement: A single Lease model MUST protect resources identified by resource ID and operation ID and MUST carry an RLock or WLock mode, expiry, and extensible information. One operation MAY hold Leases for multiple resources. RLocks are shared; a WLock is exclusive against all RLocks and WLocks for the same resource. Local and the selected remote backend use the same Lease contract and state transitions. Lease state changes MUST be atomic in SQLite transactions. Put, Get, upload, and download MUST hold RLocks; physical Local GC deletion MUST hold and renew a WLock, then re-evaluate metadata references and other deletion eligibility while holding it. Heartbeat renewal failure or expiry MUST stop the operation and prohibit subsequent Local Publish, Metadata Commit, or transfer-state confirmation. Long-running I/O MUST NOT hold Repository-wide exclusive coordination. I/O already sent before expiry MAY complete late; this is a documented availability boundary, not a reason to add fencing, deletion states, or storage-specific transitions.
    provenance:
      origin: imported
  - id: REQ-READ-GC-EXCLUSION
    level: system_requirement
    kind: concurrency-invariant
    statement: Get, Cat, and download MUST hold renewable RLocks for each content ID and temporary path they still need until access ends. GC MUST acquire and renew the corresponding WLock before physical deletion and re-evaluate deletion eligibility after acquisition. Renewal failure or expiry stops the operation and prohibits subsequent publication or state changes. A request already sent to GCS MAY complete after expiry; a resulting 404 during a read is a local operation error and MUST NOT mutate Metadata references or propagate as a repository-wide state change. Long-running response or network I/O MUST NOT hold Repository-wide exclusive coordination.
    provenance:
      origin: imported
  - id: REQ-EXPLICIT-DIRECTORIES
    level: system_requirement
    kind: namespace-invariant
    statement: The logical namespace MUST use explicit first-class directory Entries and preserve empty directories.
    provenance:
      origin: imported
  - id: REQ-REPLACEMENT
    level: system_requirement
    kind: commit-invariant
    statement: When replacing an Entry's content, the old committed Entry MUST remain authoritative until the new Object is committed and the replacement Metadata Commit succeeds.
    provenance:
      origin: imported
  - id: REQ-NO-RESUME
    level: system_requirement
    kind: failure-invariant
    statement: Repository operations MUST NOT persist logical-operation progress for later resumption; interruption is handled according to the last committed boundary. Remote delivery may persist a content-ID-level delivery obligation and confirmation so unfinished content can be rediscovered and a fresh idempotent transfer attempted; this is not resumption of the original Put and does not create Pending Entries.
    provenance:
      origin: imported
  - id: REQ-PUT-STAGE-RESOURCE-LEASE
    level: system_requirement
    kind: concurrency-invariant
    statement: Put MUST acquire an RLock for its operation-specific temporary resource before creating the Stage path. Stage copies and hashes input while that RLock is heartbeated. After hashing determines the content ID, Put MUST acquire an RLock for that content ID while retaining the temporary-resource RLock; it MUST retain both protections through Local no-replace publication and Metadata Commit, then release them. The same Resource Lease validity check authorizes Put Commit; a separate Put-only Operation Lease is not part of the target model. Any Lease renewal failure or expiry stops Put and prohibits subsequent Local Publish, Metadata Commit, or transfer-state confirmation. Stage MUST write only through its original open file and MUST NOT recreate a removed path.
    provenance:
      origin: imported
  - id: REQ-DELIVERY-MODES
    level: system_requirement
    kind: deployment-invariant
    statement: The repository MUST support Local delivery mode, where Local Object Storage is the durable authority, and Remote delivery mode, where each write first durably commits complete content to Local and atomically commits Metadata plus its remote delivery obligation. Exactly one remote object-storage backend is selected per repository. Phase A exposes the committed state immediately through the single daemon; asynchronous delivery follows the configured idle/periodic/maximum-delay policy. The current and only implemented remote backend is GCS.
    provenance:
      origin: human-authored
  - id: REQ-REMOTE-BACKEND-SELECTION
    level: system_requirement
    kind: deployment-invariant
    statement: Each repository MUST select at most one remote object-storage backend. Local durable staging/cache and asynchronous delivery are part of Remote mode semantics. Multiple remote backends, fanout, failover, tiering, and a provider plugin registry are unsupported and are not planned. GCS is the sole currently implemented remote backend.
    provenance:
      origin: human-authored
  - id: REQ-REPLICATION-OBLIGATION
    level: system_requirement
    kind: persistence-invariant
    statement: Uncompleted GCS delivery obligations MUST be stored in a persistent transfer queue keyed by content ID and MUST be atomically enqueued in the same Metadata transaction that commits the local Entry version. The MetadataStore semantic API MUST expose this atomic operation without exposing SQL or SQLite transaction types; alternate adapters MUST provide equivalent transaction semantics. A configurable synchronization scheduler MUST select uncompleted IDs after an idle interval, periodic check, or maximum delivery delay, subject to configurable parallelism. It MUST upload each content ID at most until confirmed; before sending bytes it MUST reconcile an already-existing immutable final object by API attributes, so identical content already delivered successfully is not needlessly retransmitted. After API-contract completion is confirmed, the queue obligation MUST be deleted. The queue MUST NOT represent logical Entries as Pending or promise resumption of the original write.
    provenance:
      origin: imported
  - id: REQ-FUSE-DURABILITY
    level: system_requirement
    kind: filesystem-commit-invariant
    statement: A successful FUSE Fsync MUST mean the complete file bytes have been durably published as an immutable Local Object and the corresponding Metadata revision plus any GCS delivery obligation have committed atomically. GCS upload is asynchronous and is not part of Fsync. A crash after successful Fsync but before Flush, Close, or Release MUST preserve that committed revision and its queued delivery obligation. The daemon's generic Resource Release MUST NOT commit bytes. The FUSE adapter MUST attempt Commit for remaining dirty staging on Fsync and final close, before sending daemon Release; a failed attempt MUST leave staging and a durable or Begin-anchored recovery manifest. The adapter's ordinary handle close is therefore distinct from explicit daemon Abort and explicit recovery discard. A failed CAS MUST never silently retry against a newer revision. Before a commit attempt, the last committed revision remains visible and intact.
    provenance:
      origin: human-authored
  - id: REQ-FUSE-FILE-HANDLES
    level: system_requirement
    kind: filesystem-handle-invariant
    statement: >-
      Phase A FUSE is a separate read-write process and module using only the public controlrpc contract and directly accessible shared-host file:// Resources. The public contract MUST resolve an Entry's current metadata and path by stable Entry ID, begin read and write Resources by Entry ID, and support moving or removing exactly an Entry ID. Each open file is represented by a stable Entry ID. Multiple writable handles for the same Entry MUST share one daemon write session and staging file; the adapter MUST serialize staging I/O, fsync, rename, unlink, and final close so a Commit cannot race a write. O_APPEND writes MUST choose the current staging end and perform the append under that shared per-Entry serialization. Read handles keep their BeginRead Resource and immutable object lease through unlink or rename until that handle closes. Rename changes only the namespace path and MUST NOT change Entry identity; an existing write session MUST commit by its captured Entry ID and original revision at the Entry's current path. Create sessions for absent paths remain path-bound and MUST conflict if that name becomes occupied. Unlink removes the namespace entry immediately. Before removal, each active write session for the Entry MUST durably record explicit discard intent including the stable Entry ID; open handles may continue private staging I/O, but writes after unlink MUST never be committed or retried into the namespace, and Fsync MUST only synchronize private staging. If the daemon crashes after durable unlink intent but before namespace removal, startup MUST remove only that Entry ID before cleaning staging. If that Entry ID is already absent, startup MUST only clean staging. A failed Entry removal or tombstone cleanup MUST retain the tombstone and prevent startup from accepting requests until a later retry succeeds. Final close MUST finish tombstone cleanup; daemon expiry MUST clean tombstoned staging without exposing it as ordinary Recovery. This explicit deletion intent is distinct from Commit-failure Recovery. A write handle whose Commit fails MUST enter a terminal error state and MUST NOT begin a new session or change its CAS expectation; its original staging and Recovery remain available. FUSE Flush is not a commit or final-close signal. O_TRUNC truncates the shared staging view and marks it dirty; the committed old Entry remains visible until successful Fsync/final-close Commit. Rename to an occupied target MUST fail with EEXIST in Phase A; replacement rename is deferred. Hard links are unsupported and Link MUST return an unsupported-operation error; reported link count is one. Successful local Rename, Unlink, and Rmdir callbacks MUST leave cached inode-tree mutation to go-fuse rawBridge and MUST NOT issue synchronous NotifyDelete or EntryNotify from those request handlers. Phase A MUST use zero kernel entry/attribute cache lifetimes and direct I/O, so later lookups resolve namespace changes made by CLI or other adapters and file reads bypass the kernel page cache. The FUSE adapter MUST refresh metadata and path by stable Entry ID on inode access after external changes; content invalidation notifications are unnecessary for direct-I/O handles. Map missing Entry to ENOENT, namespace collision to EEXIST, non-empty directory removal to ENOTEMPTY, revision/session conflict to EAGAIN, expired/stale handles to ESTALE, invalid requests to EINVAL, permission/auth failures to EACCES, and other daemon/transport failures to EIO; preserve local filesystem errno where available.
    provenance:
      origin: human-authored
  - id: REQ-REPRODUCIBLE-E2E-GATES
    level: system_requirement
    kind: verification-invariant
    statement: >-
      The repository MUST provide one host-command G0-G3 verification gate with isolated temporary repository state, recorded scenario evidence, bounded readiness/operation deadlines, strict terminal PASS/FAIL/SKIP outcomes, and unconditional project-scoped cleanup. Docker Compose MUST manage only external dependency services; the nando daemon, real FUSE mount, and E2E runner MUST execute natively on the Linux/WSL host. G0 MUST run root and FUSE module tests, race tests, lint, native binary builds, and Design IR validation. G1 MUST use a real kernel FUSE mount in Local mode without GCS and verify CRUD, fsync/final-close durability, multiple writers, stable-Entry rename, open-handle unlink, and CAS conflict/recovery. G2 MUST use a pinned fake GCS JSON API emulator and verify local-before-remote commit, a directly observed emulator outage plus the corresponding repository transport error, retry after emulator restart, and idempotent duplicate content delivery through external object API observations. G2 MUST inject an upload-response hold after the emulator has persisted an object, crash the daemon before transfer acknowledgement, then verify restart retries the pending obligation without changing object generation or creating another object. Recovery retry MUST use the original durable CAS expectation: an absent-path session MAY commit only while the path remains absent; an existing Entry session MUST commit only while its observed identity and content remain valid (allowing namespace-only rename under the stable-Entry contract). A retry that succeeds MUST remove the recovery obligation only after committed content is externally readable and byte-identical; a genuine conflict MUST retain staging and the original expectation, identify the conflict, and MUST NOT overwrite the winning Entry. Recovery verification MUST invoke retry and compare the committed bytes with the exact expected payload and SHA-256, not infer content from record metadata. G3 MUST crash and restart daemon and FUSE processes, verify uncommitted staging Recovery, and verify successful-fsync data persistence. Child processes MUST be tracked in isolated process groups; timeout and abnormal exit cleanup MUST inspect run-scoped FUSE mounts and processes, report uninterruptible D-state processes, and make any cleanup failure fail the gate. A missing FUSE device or denied mount MUST be reported as SKIP or FAIL and MUST NOT count as a passing real-mount gate. G4 stress MAY run separately and MUST remain bounded; when enabled it MUST verify large binary content, truncation, deterministic random-offset writes through concurrent handles to one file, and final bytes by SHA-256. The emulator MUST NOT be treated as evidence of IAM, ACL, or complete production GCS semantics.
    provenance:
      origin: human-authored
  - id: REQ-RESOURCE-SESSIONS
    level: system_requirement
    kind: resource-session-invariant
    statement: The daemon MUST own Resource sessions and their Commit, Abort, Release, Renew, and Revoke lifecycle. A session MUST expire after its finite TTL unless the client explicitly renews it; expiry transition and Renew MUST serialize atomically so once expiry wins no renewal can succeed. Expiry, revocation, and Commit MUST serialize so either Commit begins while the session is live or expiry/revocation wins and later Commit is rejected. A live read session pins its immutable Local object with a renewable content RLock; Release, Revoke, expiry, or daemon shutdown MUST stop heartbeat and release that lease. A write session binds its logical path and observed Entry identity/revision (or absence) at Begin; clients MAY request stable-Entry-ID commit so a renamed existing Entry is resolved at its current path; Repository compares the Begin snapshot of all non-namespace content fields and conditionally updates against the current revision, allowing rename-only revision changes while rejecting intervening content changes. Absent-path sessions remain bound to their original path. Commit MUST enforce that exact expectation with Repository-owned CAS and atomically publish Local content plus Metadata and any GCS delivery obligation. Session setup failures MUST release acquired leases. Before returning mutable staging, its durable Begin manifest MUST tie staging path to session ID, logical path, and CAS expectation, providing restart reconstruction even if a later recovery update fails. Stable-Entry recovery manifests MUST persist the observed Object ID in canonical string form and restore it before retry; serializing the opaque content-ID value as an empty JSON object is insufficient to validate the observed content snapshot. Commit failure MUST sync staging and persist session ID, original CAS expectation, failure reason, and timestamps; on sync or manifest failure the daemon MUST retain the staging and Begin manifest, keep same-process retry state, and report the durability error. Uncommitted generic Release, Revoke, expiry, and shutdown MUST preserve staging as recovery; generic Release MUST NOT commit. The FUSE adapter owns dirty-write Commit on Fsync/final close before daemon Release. Explicit Abort and recovery discard are destructive cancellation operations and MUST persist a discard tombstone before deleting staging. FUSE unlink MUST durably mark affected active write sessions for discard before namespace removal; those open handles may continue private staging I/O, but Commit is forbidden and their final Release or daemon restart completes tombstone cleanup without exposing ordinary Recovery. Recovery data is independent of session leases and MUST NOT be removed by Repository/object GC. Recovery listing, retry, and discard are explicit operations; retry MUST use the original CAS expectation, with no automatic overwrite or CAS bypass. Resource URIs MUST be scheme-extensible and directly accessible to the requesting client. Phase A supports local file:// URIs for daemon-created mutable staging and immutable read resources; remote data transfer schemes are deferred.
    provenance:
      origin: human-authored
  - id: REQ-RESOURCE-RECOVERY
    level: system_requirement
    kind: durable-recovery-invariant
    statement: >-
      Before returning a mutable staging Resource, the daemon MUST durably persist a manifest that ties its staging path to the session ID, repository path, and Begin-time CAS expectation; this is the durable reconstruction anchor if later recovery persistence fails. Before returning a Commit failure, it MUST sync the staging file and atomically persist the failure reason and update timestamp. If staging sync or recovery manifest update fails, the daemon MUST report the error, retain the Begin manifest and staging, keep the expired session non-renewable and non-committable, and expose a reconciliation/retry path that syncs staging and persists Recovery metadata before any Repository Put. A failed reconciliation MUST retain one retryable in-memory representation and MUST NOT create inconsistent active and recovery entries. After Repository Commit succeeds, it MUST durably record completion before best-effort staging cleanup, so startup can distinguish a committed write from an interrupted one. Startup MUST promote interrupted active sessions to explicit recovery records rather than deleting their staging. Recovery retry MUST preserve the captured CAS expectation; repeated conflicts leave record and bytes unchanged except for the latest failure reason and timestamp. Recovery data is outside Object Store GC authority. Explicit Abort/discard MUST durably persist a discard tombstone before changing in-memory discard state or deleting staging or its manifest; a failed intent write leaves the original in-memory state retryable. Startup and shutdown MUST retry cleanup from durable tombstones after partial deletion; cleanup failures MUST preserve the tombstone for a later restart and MUST NOT expose it as recovery. Repeated cleanup attempts MUST be safe. Uncommitted Release is abandonment/recovery and MUST NOT imply Commit; adapter-specific fsync/final-close behavior is responsible for committing dirty bytes. Only an explicit recovery discard or successful commit may remove recovery staging; no automatic retry may weaken CAS.
    attributes:
      session_ttl: 30-seconds
      expiry_sweep_resolution: maximum-100ms
      renewal: explicit-client-RPC
      expiry_clock: daemon-wall-clock
      manifest: durable-atomic-JSON
      manifest_version: 2
      manifest_staging_path: repository-root-relative
      manifest_staging_path_format: temp/rpc-sessions/<session-id>.stage
      manifest_staging_path_validation: exact-session-match; reject-absolute-and-traversal; reject-symlinks; require-regular-file
      legacy_manifest_v1: never-open-stored-absolute-path; migrate-only-when-current-root-expected-stage-exists-and-is-regular
      begin_manifest_reconstruction_anchor: true
      durable_commit_completion_marker: true
      durable_discard_tombstone_before_cleanup: true
      generic_release_commits: false
      fuse_fsync_and_final_close_commit_owner: FUSE-adapter
      recovery_operations: [list, retry-original-CAS, discard-explicitly]
      gc_ownership: excluded-from-repository-object-GC
      commit_failure_staging: retained-and-synced
    provenance:
      origin: human-authored
  - id: REQ-GCS-PUBLICATION
    level: system_requirement
    kind: object-publication-invariant
    statement: GCS upload MUST begin only after the content ID and an expected MD5 computed independently of the upload stream are known. It MUST use a resumable upload directly to objects/{content_id}, MUST NOT create a temporary GCS Object or copy one, and MUST NOT replace an existing live Object. Synchronization MUST first query/reconcile an existing final object by API attributes and skip payload upload when the same immutable content is already delivered. A successful GCS API upload response is authoritative transfer completion. If the response is ambiguous, the Repository MUST query the final object and use GCS API attributes to converge; an existing-name/precondition result MUST be handled idempotently by checking those API attributes against the expected content ID, size, and precomputed MD5, independent of how many input bytes the failed upload consumed. The Repository MUST retain the GCS generation and other API metadata required for subsequent conditional operations. A separate full-object read-back SHA-256 pass is not required; Local hash verification remains required, and detection of arbitrary external GCS corruption is not guaranteed.
    provenance:
      origin: imported
  - id: REQ-LOCAL-CAPACITY-GC
    level: system_requirement
    kind: garbage-collection-invariant
    statement: Capacity GC and local invalid-orphan GC MUST be distinct maintenance operations. Capacity GC MUST operate on Local storage only, inspect configured capacity policy, and reclaim eligible Local cache copies only when needed; it MUST NOT delete remote Objects, Local authoritative Objects in Local mode, undelivered Remote-mode Objects, or RLock-protected resources. Local orphan cleanup MUST preserve every content ID with an uncompleted remote delivery obligation and recheck that obligation under the content WLock immediately before deletion. Ordinary and scheduled Repository GC MUST NOT enumerate or delete remote Objects. The dedicated `nando admin recover` command MUST detect remote Objects whose Content IDs have no SQLite Entry reference and create file Entries at `<recovery.directory>/<content-id>` (default `/recyclebin/<content-id>`). Original names are unknown and MUST NOT be guessed. Recovery MUST be idempotent and leave remote object names and bytes unchanged. For the current GCS backend, recovery requires a valid Content ID and exactly 16-byte GCS MD5 attribute, preserves that MD5, and treats listed GCS bytes and attributes as authoritative without a full-object download or SHA-256 re-hash. Missing/invalid MD5 MUST be reported as an error and MUST NOT be treated as successful recovery; valid objects MAY still be recovered with aggregated errors. Recovery MUST take the per-content WLock and recheck Metadata references while holding it before restoring. Existing `<recovery.directory>/<content-id>` paths containing a different Entry MUST be left untouched and reported as conflicts. SQLite reference absence MUST trigger Metadata recovery rather than remote object deletion. Put, Download, or another operation that encounters actual Local capacity exhaustion MUST fail with a capacity error; no reservation guarantee is required. No automated GC or CLI operation may delete remote Objects; deletion of a restored remote Object requires a separate explicit human action and is not provided by a project command.
    provenance:
      origin: imported
  - id: REQ-READ-THROUGH
    level: system_requirement
    kind: read-path-invariant
    statement: In Remote delivery mode, Get and Cat MUST prefer a complete Local Object. If it is absent, the Repository MUST acquire RLocks for the content ID and shared temporary ID, download from the selected remote backend to shared temporary storage, verify the complete bytes against the content ID, and publish the Local Object without replacement before serving it. A partial download MUST never become a committed Local Object. If an already-sent GCS request completes after its Resource Lease expires and a subsequent read receives 404, that read fails locally without changing Metadata. Direct remote-to-Get destination streaming is not required; progress-following streaming remains an optional future design.
    provenance:
      origin: imported
  - id: REQ-LOCAL-GCS-IMMUTABILITY
    level: system_requirement
    kind: immutability-invariant
    statement: Local and selected remote-backend publication for a content ID MUST be no-replace. Local pre-existing Objects MUST retain existing content-ID hash verification. For the current GCS backend, upload success follows the GCS API response contract; ambiguous completion and existing-name results are reconciled through object lookup and API attributes, with generation and required API metadata retained. Remote object deletion is prohibited in Repository GC and CLI workflows. Full-object GCS read-back hashing and detection of arbitrary external corruption are not required.
    provenance:
      origin: imported
  - id: REQ-METADATA-PORTABILITY
    level: system_requirement
    kind: backend-contract
    statement: MetadataStore implementations MUST provide the same observable operation and atomicity semantics for Entry creation, update, move, and deletion, including revision comparison and namespace/hierarchy invariants. Repository contracts MUST NOT expose SQLite transaction, SQL, or constraint details; each adapter MUST enforce state-dependent validation atomically with its mutation using backend-native mechanisms.
    provenance:
      origin: imported
  - id: REQ-CONTENT-MD5-METADATA
    level: system_requirement
    kind: object-integrity-metadata
    statement: MD5 is immutable content metadata and MUST be stored once per Content ID, not redundantly or potentially inconsistently on each Entry. SQLite migration MUST preserve existing Entry-associated MD5 values by consolidating them by Content ID and MUST detect conflicting or incomplete historical values without inventing integrity evidence. Existing MD5 observations MUST remain available for Local cache validation and GCS replica comparisons.
    attributes:
      identity: Content-ID
      sqlite_migration: consolidate-entry-md5; reject-conflicting-values
    provenance:
      origin: human-authored
  - id: REQ-GCS-ORPHAN-SAFETY
    level: system_requirement
    kind: recovery-operation-safety
    statement: GCS Objects MUST NOT be deleted by ordinary GC, scheduled GC, or CLI commands. The dedicated `nando admin recover` command MUST detect GCS Objects whose Content IDs have no SQLite Entry reference and restore file Entries under `<recovery.directory>/<content-id>` (default `/recyclebin/<content-id>`). The original logical name is unknown; the Content ID is the recovery name. Recovery MUST be idempotent, acquire the content WLock and recheck Metadata references while holding it, require and preserve an exactly 16-byte GCS MD5 attribute, and leave existing conflicting paths untouched and reported. GCS object bytes and attributes are authoritative for this recovery operation; it MUST NOT download the full object or re-hash it. Missing/invalid MD5 MUST be an actionable error, not a skipped success; valid objects MAY be recovered while errors are aggregated. Recovery MUST preserve GCS object bytes and names. SQLite reference absence, including complete SQLite database loss, MUST cause Metadata recovery rather than GCS deletion. Automated GCS deletion is prohibited. A restored GCS object may be deleted only by a separate explicit human action through operator-controlled GCS administration; the project provides no GCS deletion command. GCS content loss is prohibited; SQLite Metadata loss and Local cache loss are accepted.
    attributes:
      gcs_deletion: prohibited-in-Repository-GC-and-CLI
      recovery_path: configurable; default /recyclebin/<content-id>
      recovery_idempotent: true
      gcs_object_mutation: prohibited
      md5_preservation: required-exactly-16-bytes-or-report-error
      recovery_authority: GCS-bytes-and-API-attributes-no-download-or-rehash
      restore_coordination: per-content-WLock-and-reference-recheck
      path_conflict: preserve-existing-entry-and-report
    provenance:
      origin: human-authored
  - id: REQ-METADATA-BACKUP-RESPONSIBILITY
    level: system_requirement
    kind: operations-boundary
    statement: Metadata backup and restoration are operator responsibilities. A Phase A backup MUST capture the complete Repository at one consistent static point after FUSE/WebDAV clients have stopped and the daemon has shut down normally with all Repository writes ceased. It MUST preserve the association among SQLite Metadata and any WAL/SHM sidecars, Repository Format, delivery obligations, Local Objects, Recovery staging/manifests, coordination state, and repository-owned settings. Operators select the snapshot/copy mechanism; no storage technology is mandated. Restore MUST occur while stopped, preserve owner/mode and Repository configuration, and verify integrity before clients resume. Backup procedures do not require GCS delivery to drain; pending obligations are preserved for scheduler retry. Repository-external configuration and credentials remain operator-managed separately.
    provenance:
      origin: imported
  - id: REQ-ENTRY-ID
    level: system_requirement
    kind: identity-invariant
    statement: Every Entry MUST have a globally unique, opaque immutable identifier that remains unchanged throughout the Entry lifecycle.
    provenance:
      origin: imported
  - id: REQ-NAMESPACE-UNIQUENESS
    level: system_requirement
    kind: namespace-invariant
    statement: No two Entries MUST have the same name under the same parent directory, and Entry hierarchy MUST remain valid and acyclic.
    provenance:
      origin: imported
  - id: REQ-ROOT-ENTRY
    level: system_requirement
    kind: namespace-invariant
    statement: The logical namespace MUST have a first-class root directory Entry.
    provenance:
      origin: imported
  - id: REQ-DIRECTORY-NO-OBJECT
    level: system_requirement
    kind: namespace-invariant
    statement: A directory Entry MUST NOT reference content in the Object Store.
    provenance:
      origin: imported
  - id: REQ-SUBTREE-MUTATIONS
    level: system_requirement
    kind: namespace-invariant
    statement: Move and Remove MUST enforce conflicts across the affected subtree and MUST reject moving an Entry into its own descendant subtree.
    provenance:
      origin: imported
  - id: REQ-GET-ATOMIC-DESTINATION
    level: system_requirement
    kind: export-invariant
    statement: Get MUST write to a temporary file in the destination directory, set its required attributes, and atomically replace an existing regular-file destination only after successful completion; an absent destination is created, symlink and directory destinations are rejected without changing the link or its target, and failures before replacement preserve an existing regular-file destination and clean up the temporary file. A cleanup failure after successful replacement MUST identify that the destination was already published.
    provenance:
      origin: imported
  - id: REQ-DOCTOR-NONDESTRUCTIVE
    level: system_requirement
    kind: diagnostic-invariant
    statement: Doctor MUST validate repository integrity without mutating repository state unless an explicit repair mode is invoked.
    provenance:
      origin: imported

  - id: DES-REPOSITORY-BOUNDARIES
    level: system_design
    kind: responsibility-model
    statement: Repository is the protocol-independent core and sole owner of cross-store consistency, commit ordering, repository operation semantics, and Repository Format meaning and compatibility policy. CLI, FUSE, and WebDAV are peer protocol adapters; they translate protocol operations and errors but do not own repository logic, SQL, object identity, delivery policy, or recovery. The single nando daemon is the normal runtime owner of one Repository instance.
    provenance:
      origin: imported
    attributes:
      deployment_scope: single-host-single-repository
      exclusion_scope: cross-process
      unsupported_initial_capabilities:
        - distributed metadata writes
        - multi-host transactional coordination
        - multi-daemon writers (Phase A)
        - globally published revisions (Phase A)
        - user-visible version history
      coordination:
        authority: Repository
        storage: dedicated-SQLite-coordination-db
        filename: coordination.db
        transaction: BEGIN-IMMEDIATE
        transaction_release: ROLLBACK-on-success-error-cancel-or-panic
        release_failure: discard-connection-and-report-ErrRelease;operation-may-have-completed;attach-to-panic-when-panicking
        scope: all-processes-and-Repository-instances-for-one-repository
        filesystem: local-filesystem-only
        protected_operations: [Put-Commit, Get, Cat, GC, Doctor]
        mode: exclusive-for-all-protected-operations
        shared-mode: future-extension-boundary-only
        metadata-database: separate-from-coordination-database
        cancellation: context-cancellation-or-deadline-stops-lock-wait
        process-termination: SQLite-releases-lock
        panic: rollback-and-release-lock
        unsupported:
          - deleting-and-recreating-coordination-db-while-repository-is-in-use
          - direct-external-metadata-or-object-store-modification
          - multi-host-or-network-filesystem-coordination
        tradeoffs:
          - long-Get-or-Cat-blocks-Put-Get-GC-and-Doctor
          - exclusive-serialization-sacrifices-concurrent-reads
      current_put_staging_lease_observation:
        storage: separate-SQLite-database
        filename: put-leases.db
        rationale: lease-heartbeat-must-not-be-blocked-by-long-coordinated-reads
        persistent_fields: [operation_id, expires_at]
        prohibited_fields: [input-progress, content-result, metadata-result, resumable-state]
  - id: DES-CLI-BOUNDARY
    level: system_design
    kind: responsibility-model
    statement: CLI owns command-line parsing, input normalization, local stream wiring, and presentation. Repository-facing commands are JSON-RPC 2.0 clients over the configured UDS or TCP transport (UDS default); repository reads, writes, GC, maintenance, verification, and explicit Resource recovery operations execute through the authoritative daemon. CLI renews active read/write Resource sessions while it is using their URIs. It never constructs an independent Repository, executes SQL, derives content IDs, decides object reachability, or implements recovery policy. Repository initialization is a provisioning operation performed before daemon startup.
    attributes:
      exit_codes:
        success: 0
        general_failure: 1
        invalid_arguments: 2
        entry_or_object_not_found: 3
        conflict: 4
        corruption_or_verification_failure: 5
    provenance:
      origin: imported
  - id: DES-RUNTIME-CONFIGURATION
    level: system_design
    kind: user-configuration
    statement: >-
      Per-user runtime configuration is TOML at $XDG_CONFIG_HOME/nando/config.toml on Linux, macOS, and Windows when XDG_CONFIG_HOME is set; otherwise it is ~/.config/nando/config.toml on Linux/macOS and %USERPROFILE%/.config/nando/config.toml on Windows. Do not use os.UserConfigDir, macOS Application Support, Windows AppData, or conf.d for the new config location. Repository data is independent: $XDG_DATA_HOME/nando when set, otherwise ~/.local/share/nando on Linux/macOS and %USERPROFILE%/.local/share/nando on Windows. CLI arguments override TOML values, which override these defaults. A missing implicit config uses defaults; a missing explicit --config or malformed existing TOML is an error. Runtime keys include repository, verbose, the nested daemon endpoint and transport settings, and the legacy top-level daemon_* spellings; exactly one nonempty daemon token source may be selected using daemon.token, daemon.token_from_file, or daemon.token_from_env. The prior daemon.token_file and daemon_token_file spellings remain file-source aliases. Repository delivery settings remain repository-owned in repository.json. If a previous os.UserConfigDir-based initialized repository exists and the new default data repository does not, require explicit repository selection to prevent silently opening a different repository.
    attributes:
      format: TOML
      config_filename: config.toml
      config_subdirectories: unsupported
      config_directory: XDG_CONFIG_HOME/nando-or-home/.config/nando
      default_data_directory: XDG_DATA_HOME/nando-or-home/.local/share/nando
      data_and_config_separate: true
      precedence: [CLI-arguments, TOML-config, platform-defaults]
      implicit_missing_config: defaults
      explicit_missing_config: error
      malformed_config: error
      migration_guard: require-explicit-selection-when-legacy-repository-detected
      active_keys: [repository, verbose, daemon.endpoint, daemon.token, daemon.token_from_file, daemon.token_from_env, daemon.ca_cert, daemon.tls_cert, daemon.tls_key, daemon_endpoint, daemon_token_file, daemon_ca_cert, daemon_tls_cert, daemon_tls_key]
    provenance:
      origin: human-authored
  - id: DES-APPLICATION-BOUNDARY
    level: system_design
    kind: responsibility-model
    statement: Application may provide protocol-neutral use-case orchestration and daemon maintenance scheduling, but it is not a protocol adapter and does not supersede Repository semantics. CLI, FUSE, and WebDAV adapters remain peer interfaces to the daemon-owned Repository; all cross-store commit, visibility, lease, queue, and recovery decisions remain in Repository.
  - id: DES-DEPENDENCY-DIRECTION
    level: system_design
    kind: component-model
    statement: CLI, FUSE, and WebDAV are peer client processes of the daemon. They depend on the transport-neutral JSON-RPC and Resource URI client contracts, not on Repository, Metadata Store, Object Store, or daemon implementation packages. FUSE and WebDAV are each separate Go modules and separate processes and are never linked into the daemon. The daemon owns the RPC server, expiring/renewable Resource sessions, durable staging recovery, and Repository; Repository depends only on Metadata Store, Object Store, coordination, and Content Identity. No adapter dependency enters core.
    attributes:
      dependency_edges:
        - [CLI, JSON-RPC Client]
        - [FUSE Process, JSON-RPC and Resource URI Client]
        - [WebDAV Process, JSON-RPC and Resource URI Client]
        - [JSON-RPC Client, Configurable Transport]
        - [Configurable Transport, Daemon RPC Server]
        - [FUSE Module, FUSE Process]
        - [WebDAV Module, WebDAV Process]
        - [Daemon RPC Server, Resource Session Manager]
        - [Resource Session Manager, Repository]
        - [Repository, Metadata Store]
        - [Repository, Object Store]
        - [Repository, Content Identity]
        - [CLI, Paths]
        - [CLI, Runtime Config]
  - id: DES-DAEMON-RUNTIME
    level: system_design
    kind: process-model
    statement: Normal operation has one nando daemon as the execution owner of a Repository for the Phase A single-user, local-host deployment. The daemon constructs Metadata Store, Object Store, coordination, and Repository once, and serves peer CLI, FUSE, and WebDAV client processes. JSON-RPC 2.0 control messages use HTTP POST /rpc over configurable UDS or TCP; Phase A standard operation uses the per-user Unix-domain socket protected by a private parent directory (0700) and socket mode 0600. TCP support is retained and is rejected unless TLS and bearer authentication are configured, but TCP bind and credential lifecycle operations are outside standard Phase A acceptance. Phase A makes no guarantee of external exposure or multiple-OS-user authorization. The daemon owns Resource sessions, finite expiry, explicit renewal/revocation, and durable staging recovery. Expiry stops read-session repository-lease heartbeat; daemon shutdown releases read leases and promotes unfinished writes to recovery without deleting them. On the WSL Linux host, a systemd user service is the supported Phase A lifecycle manager and uses per-instance XDG configuration/data and the per-user runtime socket. A separately installed systemd system template is experimental and outside the Phase A runtime acceptance gate; it uses a dedicated non-login account and per-instance state/runtime paths, and its 0600 socket requires all clients to run as that account. Both scopes use separate nando@.service templates. GCS credentials use standard Application Default Credentials and are not persisted in repository configuration.
    attributes:
      default_host: WSL-Linux
      default_service_scope: systemd-user
      supported_service_scope: [systemd-user]
      experimental_service_scope: [system]
      service_templates: [systemd-user:nando@.service, system:nando@.service]
      service_package: nfpm-deb
      system_service_phase_a_runtime_gate: excluded
      control_protocol: JSON-RPC-2.0
      control_framing: HTTP-POST-/rpc
      control_transports: [Unix-domain-socket, TCP]
      default_transport: Unix-domain-socket
      phase_a_standard_transport: Unix-domain-socket
      phase_a_security_boundary: [single-OS-user, local-host, parent-directory-0700, socket-0600]
      tcp_requires: [TLS, bearer-authentication]
      tcp_security_operations_in_phase_a: false
      multi-user-authorization: deferred
      external-client-exposure: deferred
      cli_protocol: JSON-RPC-2.0
      client_processes: [CLI, FUSE, WebDAV]
      daemon_owned: [Repository, Resource-sessions, Commit, Abort, Release, Renew, Revoke, Recovery]
      fuse_webdav_process_local: true
      adapter_modules_inside_daemon: false
      gcs_credentials: Application-Default-Credentials
      cross_platform_runtime: deferred
      Cloud_Run: deferred
    provenance:
      origin: human-authored
  - id: DES-ADAPTERS-FILESYSTEM
    level: system_design
    kind: protocol-adapter-contract
    statement: >-
      CLI, FUSE, and WebDAV are peer processes that call daemon control methods and consume daemon-issued Resource URIs. FUSE and WebDAV each have a separate Go module and executable process; neither is linked into the daemon. They depend on the public controlrpc contract package, never on Repository or daemon implementation packages. A write Begin returns a mutable staging Resource URI and binds the observed Entry identity/revision or absence; the client writes bytes directly to that URI, then asks the daemon to Commit. A successful Commit consumes that write session and staging URI; a later dirty period starts a new write session and captures a fresh CAS expectation. The daemon hashes/verifies and publishes immutable content, enforces revision CAS, and atomically commits Metadata plus any GCS obligation. Abort is an explicit destructive cancellation; uncommitted Release/Revoke and expiry preserve a durable recovery record. Clients explicitly renew live sessions; expired sessions cannot be revived. Read sessions return immutable file:// Resource URIs under a renewable content RLock held until Release, Revoke, expiry, or daemon shutdown, protecting the object from GC while live. Failed Commit retains staging and original CAS metadata; explicit retry uses that CAS, and explicit discard is the only user-directed abandonment. Setup failures release acquired leases; daemon shutdown releases read leases and promotes unfinished writes to recovery. The daemon returns only URI schemes the client has declared accessible; Phase A file:// use requires a shared local filesystem path. URI schemes remain extensible; remote data transfer is not required in this phase. FUSE is read-write: multiple writers for one Entry share a write session and serialize staging access; rename follows stable Entry ID while Commit preserves the original revision CAS. Fsync commits dirty staging after Sync, Flush is not a commit or close signal, and final Release attempts Commit for remaining dirty bytes before daemon Release. Unlink removes the name immediately, records durable discard intent for active write staging before removal, allows open handles private I/O without publishing post-unlink writes, and discards staging at final close or restart instead of Recovery. O_TRUNC affects private staging only until commit; hard links are unsupported; Phase A uses zero kernel entry/attribute cache lifetimes and explicit POSIX errno mapping. WSL Windows Explorer accesses the separate FUSE process mount through the WSL native share. Cross-platform adapters and Cloud Run are deferred.
    attributes:
      fuse_access: read-write
      webdav_access: read-write
      webdav_process_and_module: separate-peer-of-daemon
      webdav_http_methods: [GET, HEAD, OPTIONS, PROPFIND, PUT, DELETE, MKCOL, MOVE, file-COPY]
      webdav_put_commit_boundary: daemon-Commit-before-success-response
      webdav_etag: stable-Entry-ID-and-committed-revision
      webdav_conditional_put: If-Match-and-If-None-Match-against-Begin-CAS-snapshot
      webdav_phase_a_listener: loopback-only-HTTP; no-client-authentication; no-TLS; external-exposure-deferred
      webdav_phase_a_clients: same-local-user-only
      webdav_conditional_write_policy: If-Match-and-If-None-Match-against-Begin-CAS-snapshot; reject-unsupported-conditions
      webdav_unsupported_until-contract-defined: [LOCK, UNLOCK, PROPPATCH, dead-properties, directory-COPY, COPY-overwrite, MOVE-overwrite]
      fuse_fsync: durable-Local-Object-and-atomic-Metadata-plus-delivery-obligation
      fuse_release_is_commit_boundary: true
      fuse_release_order: Commit-dirty-staging-before-Resource-Release
      dirty_write_visibility: private-until-Fsync-or-final-Release-commit
      commit_failure: durable-staging-recovery-with-original-CAS
      resource_session_ttl: 30-seconds
      session_renewal: client-driven
      session_expiry_stops_repository_lease_heartbeat: true
      rename_identity: stable-Entry-ID-with-original-revision-CAS
      multiple_fuse_writers: one-shared-session-per-entry
      open_unlink: remove-name-now-discard-staging-after-last-handle
      post_unlink_fsync: sync-private-staging-without-commit
      flush_is_commit_or_final_close_signal: false
      o_trunc: truncate-private-staging-old-committed-version-remains-visible-until-commit
      rename_replacement: unsupported-EEXIST
      hard_links: unsupported
      kernel_entry_and_attribute_cache_ttl: zero
      errno_mapping: POSIX-minimal-explicit
      adapter_calls: daemon-JSON-RPC-and-Resource-URI
      resource_schemes: extensible
      phase_a_resource_scheme: file
      resource_contract_package: controlrpc
      remote_data_transport: deferred
      module_and_process_per_adapter: true
      Windows_Explorer: WSL-native-share
      Windows_native_driver: deferred
      cross_platform: deferred
      Cloud_Run: deferred
    provenance:
      origin: human-authored
  - id: DES-LOCAL-COMMIT-GLOBAL-PUBLISH
    level: system_design
    kind: visibility-and-replication-model
    statement: Local Commit and Global Publish are separate concepts. A Local Commit means complete immutable bytes are durable in Local Object Storage and the local Metadata mutation plus any remote delivery obligation committed atomically; it is the local recovery boundary. In Phase A, the single daemon's SQLite Metadata is the visible head immediately after Local Commit and the selected remote backend is delivered asynchronously (currently GCS). In Phase B, a Local Commit is private to its daemon until Global Publish advances the Published Head; other daemons continue to observe the prior Published Head, which remains available until the new version is globally committed. A pending local version must never leak through shared Metadata as if it were globally published. Firestore transaction and multi-daemon coordination mechanics are deferred to Phase B.
    attributes:
      phase_a_local_visibility: immediate-after-local-commit
      phase_a_metadata: SQLite
      phase_a_remote_delivery: idle-scheduled;single-selected-backend
      phase_b_local_visibility: originating-daemon-only-before-publish
      phase_b_global_visibility: Published-Head
      preserve_previous_published_head_until: new-global-publish
      phase_b_backend: Firestore-or-other-shared-backend
      phase_b_distributed_coordination: deferred
    provenance:
      origin: human-authored
  - id: DES-GCS-SYNC-SCHEDULING
    level: system_design
    kind: replication-scheduler
    statement: Remote writes commit content and a content-ID delivery obligation but do not start a payload upload per write. A daemon scheduler selects work after the configured idle interval, on the configured periodic check, or when the oldest obligation reaches its configured maximum delivery delay; the earliest applicable trigger makes work eligible. Parallel upload count is configurable. For the current GCS backend, before uploading bytes, the worker checks the final immutable object name and reconciles API attributes so an already-delivered content ID is completed without retransmission. Queue state remains durable across daemon restarts. A queued content ID protects its complete Local source from orphan and capacity GC until delivery is confirmed.
    attributes:
      triggers: [idle-interval, periodic-check, maximum-delivery-delay]
      configurable: [idle-interval, periodic-check-interval, maximum-delivery-delay, parallelism]
      transfer_scope: content-ID
      transfer_per_write: false
      same_content_id_payload_resend: false
      queue_survives_restart: true
    provenance:
      origin: human-authored
  - id: DES-CONSTRUCTION
    level: system_design
    kind: composition-root
    statement: The executable composition root reads persisted Repository Format metadata and Repository settings, validates their meaning and compatibility before use, then composes the metadata backend, object backend, digest algorithm, and Repository. Repository settings own Local/Remote delivery mode, the one selected remote backend and its bucket, and capacity policy; they are distinct from per-user runtime TOML configuration, which owns repository selection and client/daemon runtime options only. New settings use generic remote field names; legacy GCS settings remain readable without rewriting existing repository files. The SQLite adapter owns schema migrations and persistence of Repository Format values.
    attributes:
      current_backends: [SQLite Metadata Store, Local Object Store, GCS remote object storage]
      remote_backend_selection: exactly-one-per-repository;currently-GCS
      repository_owned_settings: [delivery-mode, remote-backend, remote-bucket, capacity-policy]
      current_settings_file: repository.json
      current_settings_fields: [delivery_mode, remote_backend, remote_bucket, max_local_bytes]
      legacy_settings_fields_read: [delivery_mode-gcs, gcs_bucket]
      legacy_repository_without_settings: defaults-to-Local;is-not-reconfigured-by-init
      settings_scope_limit: capacity-policy-representation-not-yet-implemented
    provenance:
      origin: imported
  - id: DES-METADATA-MODEL
    level: system_design
    kind: metadata-model
    statement: Entry IDs are globally unique opaque internal identifiers; parent-child relationships are authoritative, logical paths are derived, sibling names are unique, and canonical path caches are disposable derived data.
    provenance:
      origin: imported
    attributes:
      current_entry_id_implementation: UUIDv4
  - id: DES-OBJECT-MODEL
    level: system_design
    kind: object-model
    statement: Object Stores own immutable content bytes identified by algorithm-namespaced content IDs, independent of logical names or paths. Local and the single selected remote object-storage backend are physical copies whose durability role depends on delivery mode; committed immutable publication, verification, enumeration, and deletion never assign logical paths. GCS is the current remote backend.
    provenance:
      origin: imported
  - id: DES-DOCTOR
    level: system_design
    kind: diagnostic-contract
    statement: Doctor checks Repository health by validating committed metadata references, referenced Object content identity, logical metadata invariants, and supported Repository Format before reporting healthy. It is non-destructive; repair is outside Doctor and requires a separate explicit operation. Valid unreferenced committed Objects are not Doctor findings and remain the Orphan/Invalid GC subtask's responsibility.
    provenance:
      origin: imported
  - id: DES-ERROR-MODEL
    level: system_design
    kind: error-contract
    statement: Domain errors are typed or sentinel errors mapped at the CLI boundary; message-text matching is not the primary corruption or verification classification mechanism.
    attributes:
      stable_categories:
        - invalid arguments
        - Entry or Object not found
        - path conflict
        - repository corruption
        - unsupported repository format
        - repository busy or locked
      coordination_errors:
        acquisition: ErrAcquire-wraps-context-and-SQLite-causes
        callback: ErrOperation-wraps-the-callback-cause
        release: ErrRelease;callback-success-may-already-be-reflected;release-failures-attach-to-panic
    provenance:
      origin: imported
  - id: DES-SCAFFOLDING-BOUNDARY
    level: system_design
    kind: implementation-scope
    statement: Scaffolding avoids placeholder packages unless they establish a compile-time contract used by current code; architecture is expressed through explicit interfaces, invariants, and tests.
    provenance:
      origin: imported
  - id: DES-OBJECT-BACKEND-NEUTRALITY
    level: system_design
    kind: backend-contract
    statement: Object staging mechanisms, physical layout, and prefix or bucket separation are backend-internal choices and are not Repository-wide contracts.
    provenance:
      origin: imported
  - id: DES-OBJECT-CONSISTENCY
    level: system_design
    kind: backend-contract
    statement: Object Store consistency and availability beyond successful Commit visibility are backend-specific; the shared design does not classify all Object Stores as eventually consistent.
    provenance:
      origin: imported
  - id: DES-LEASE
    level: system_design
    kind: resource-lock-model
    statement: Lease has one model for Local and the selected remote backend; resource ID, operation ID, RLock/WLock mode, expiry, and extensible information. One operation may hold multiple resource Leases. RLock is shared; WLock excludes all locks for its resource. Leases are heartbeated while the operation is active and explicitly released when it completes. Defaults are TTL 30 seconds and heartbeat 5 seconds, both configurable; expiry uses the SQLite database clock. There is no separate Put-only Operation Lease in the target design.
    attributes:
      expiration_representation: absolute-utc-timestamp
      active_operation: heartbeat-until-completion
      completion: explicit-release
      default_ttl: 30-seconds;configurable
      default_heartbeat_interval: 5-seconds;configurable
      expiry_clock: SQLite-database-clock
    provenance:
      origin: imported
  - id: DES-PUT-STAGE-COMMIT
    level: system_design
    kind: put-lifecycle
    statement: Put acquires an RLock for the operation-specific temp resource before creating Stage, then copies and hashes outside Repository-wide exclusive coordination while heartbeating. After the content ID is known, Put acquires its content-ID RLock and retains both RLocks through Local no-replace publication and Metadata Commit; Remote mode commits the Entry and idempotent delivery-queue item in that same Metadata transaction. The resource Lease validity check authorizes Commit. Put releases all Leases when complete. Remote delivery is content-ID-scoped and does not make Put resumable or exactly-once.
    attributes:
      staging_order: [acquire-temp-RLock,create-operation-temp,copy-and-hash-with-heartbeat]
      content_lock_transition: acquire-content-ID-RLock-after-hash;retain-temp-RLock
      commit_order: [verify-all-Leases-current,Local-no-replace-Publish,atomic-Metadata-Entry-and-queue-Commit]
      heartbeat: until-operation-completion
      renewal_failure_or_expiry: stop;prohibit-subsequent-Publish-Metadata-Commit-or-queue-confirmation
      completion: release-all-operation-Leases
      no_separate_put_operation_lease: true
    provenance:
      origin: imported
  - id: DES-DELIVERY-MODES
    level: system_design
    kind: storage-delivery-model
    statement: Local delivery mode does not construct or contact a remote backend and treats Local as the durable authoritative Object copy. In Phase A Remote mode, each write first persists a complete immutable Local Object and atomically commits Metadata plus a content-ID delivery obligation, making the committed Entry immediately visible through the single daemon; asynchronous transfer waits for the configured scheduler. Local data remains the durable source until delivery is confirmed. After confirmation, Local may act as an evictable cache while SQLite Metadata remains the Phase A authority for logical Entries and paths. Exactly one remote backend is selected for a repository; the current implementation selects GCS. In Phase B, Local Commit and Global Publish are separate and shared Metadata exposes only the Published Head. A content ID can be referenced by multiple Entries and is delivered once per content identity, independent of logical names.
    attributes:
      modes: [local, remote]
      remote_backend_count: exactly-one
      additional_remote_backends: unsupported-and-not-planned
      local_mode: [remote-backend-absent, Local-authoritative]
      remote_mode_put_order: [acquire-temp-RLock-before-Stage, Local-Stage-and-hash, acquire-content-ID-RLock, Local-no-replace-publication, atomic-Metadata-Entry-and-transfer-queue-Commit, idle-scheduled-transfer, delete-queue-row-after-API-confirmation, release-Leases-on-completion]
      remote_mode_visibility: [Phase-A-local-Metadata-Commit, Phase-B-Global-Publish]
      pre_remote_delivery_failure: Local-physical-loss-may-lose-unreplicated-content
      local_cache_eviction: only-after-confirmed-remote-delivery
      gcs_object_name: objects/{content_id}
      gcs_upload: resumable-direct-to-final-name;no-temporary-object-or-copy
      transfer_key: content-ID
      shared_temporary_storage: [Put-spool, GCS-download-staging]
      get_export_staging: destination-directory-temporary-file-per-REQ-GET-ATOMIC-DESTINATION
      gcs_direct_get_stream: not-required
      optional_streaming: progress-following-stream-design-may-be-considered-later
    provenance:
      origin: imported
  - id: DES-REPLICATION-STATE
    level: system_design
    kind: remote-delivery-state-model
    statement: The MetadataStore owns a content-ID-keyed queue of uncompleted remote deliveries. The current implementation selects GCS as the single remote backend. A Local Commit atomically commits the Entry and idempotently enqueues its content ID in one backend transaction; SQLite stores both in the existing Metadata database, and alternate adapters provide the same semantic atomicity without exposing backend transactions. The idle synchronization scheduler selects remaining rows from complete Local content. It reconciles the final GCS object before payload upload; a matching already-delivered ID completes without resending content. A successful GCS API response, or final-object API attributes resolving an ambiguous/existing-name result, confirms delivery and causes the queue obligation to be deleted. A crash before deletion leaves the row for retry; retry is idempotent. The queue is not an Entry-level Pending state, Operation Record, or resumption of the original write.
    attributes:
      confirmed_delivery_evidence: GCS-success-response-or-ambiguous-response-object-query-using-API-attributes
      retained_remote_metadata: [GCS-generation, API-attributes-required-for-conditional-operations]
      full_object_readback_SHA256: not-required
      uncompleted_queue_rows: durable-retry-source-after-restart
      completed_transfer: delete-row-after-selected-remote-backend-contract-confirmation
      queue_completion: delete-row-after-selected-remote-backend-contract-confirmation
      retry: idle-periodic-and-max-delay-scheduled-while-row-remains
      already_delivered_content: reconcile-final-object-before-payload-upload
      duplicate_transfer: idempotent-enqueue-and-API-attribute-reconciliation
      no_temporary_remote_object: true
    provenance:
      origin: imported
  - id: DES-RESOURCE-LEASES
    level: system_design
    kind: gc-protection-protocol
    statement: A single Resource Lease model uses resource ID, operation ID, RLock/WLock mode, expiry, and extensible information; one operation may protect multiple resource IDs. RLocks are shared and WLocks exclusive for the same resource. Local and the selected remote backend use identical Lease states and transitions. The dedicated resource-lock area is managed atomically with SQLite transactions and is the sole GC protection mechanism. Leases default to a configurable 30-second TTL and 5-second heartbeat; SQLite database time is the expiry comparison basis. Put obtains a temporary-resource RLock before Stage creation, then a content-ID RLock after hashing while retaining the first through Local Publish and Metadata Commit. Get, Cat, upload, and download hold and heartbeat RLocks through resource use. Local GC obtains and heartbeats a WLock, then rechecks references and deletion eligibility before physical removal. All locks release when their operation completes. Renewal failure or expiry stops further Publish, Commit, or state confirmation; an I/O request sent before expiry may still complete late. This may make an object unavailable (including a read 404); that is a localized operation failure and does not mutate Metadata. No fencing token, deleting state, storage-specific transition, or long Coordinator lock is required.
    attributes:
      lock_scope: resource-ID-content-or-temporary-ID
      lock_modes: [RLock-for-Put-Get-Cat-upload-download, WLock-for-GC-physical-delete]
      lock_fields: [resource-ID, operation-ID, mode, expiry, extensible-information]
      lock_storage: dedicated-resource-lock-area-in-SQLite-coordination-database;managed-by-SQLite-transactions
      operations: [Put, GCS-upload, GCS-download, Get, Cat, GC]
      heartbeat: renew-expiring-lock-while-resource-is-in-use
      renewal_failure: stop-operation;do-not-publish-partial-download
      coordination_long_io: prohibited
      duplicate_gc_protection_mechanism: prohibited
      expired_inflight_io: may-complete-late;localized-unavailability-allowed
    provenance:
      origin: imported
  - id: DES-GC-CLASSES
    level: system_design
    kind: garbage-collection-model
    statement: Capacity GC and local orphan/invalid GC are separate subtasks under the maintenance scheduler. Capacity GC reads Repository capacity settings and reclaims Local cache space only when required; it preserves Local-mode authority, undelivered Remote-mode Objects, and RLock-protected resources. If an operation encounters actual capacity exhaustion, it returns a capacity error without requiring a reservation guarantee. Local orphan/invalid GC reconciles malformed, corrupt, or unreferenced Local artifacts while respecting pending delivery obligations and resource leases. Ordinary/scheduled GC never enumerates or deletes remote Objects. The dedicated `nando admin recover` CLI command lists GCS objects with no SQLite reference and restores file Entries under `<recovery.directory>/<content-id>` (default `/recyclebin/<content-id>`), requiring an exactly 16-byte MD5 attribute and treating GCS bytes and attributes as authoritative without a full download or SHA-256 re-hash. Recovery is idempotent, reports and preserves conflicting paths, continues valid entries while aggregating failures, and does not move, copy, or delete GCS objects. GCS content is retained when Metadata is absent or incomplete; restored GCS content can be deleted only through an explicit human action in operator-controlled GCS administration, for which the project provides no command.
    attributes:
      capacity_gc: [Remote-mode-only-eviction-of-confirmed-Local-cache-objects, resource-RLock-aware]
      invalid_orphan_gc: [Local-invalid, Local-unreferenced, resource-WLock-before-physical-delete]
      remote_orphan_management: CLI-only-metadata-recovery-to-recyclebin; idempotent; remote-objects-unchanged
      Local_mode: no-capacity-eviction-of-authoritative-Objects
      last_known_good_copy: protected-from-Repository-GC
      gcs_delete: prohibited
      remote_recovery: create-entry-at-configured-directory-content-id; default-recyclebin; current-GCS-backend-requires-exact-16-byte-md5; trust-provider-attributes; no-download-or-rehash; collision-safe
      metadata_loss: GCS-content-preserved; SQLite-metadata-loss-accepted; Local-cache-loss-accepted
      delayed_local_delete_after_expiry: allowed;availability-risk-recorded
      shared_protection_authority: resource-RWLock-only
    provenance:
      origin: imported
  - id: DES-MAINTENANCE-JOB
    level: system_design
    kind: periodic-maintenance
    statement: A single daemon maintenance scheduler starts three independent subtasks (uncompleted transfer synchronization, Capacity GC, and Orphan/Invalid GC). GCS synchronization becomes eligible after configured idle time, on a periodic check, or when the oldest obligation reaches its configured maximum delivery delay; it uses configured parallelism. GC remains periodically scheduled. Each subtask owns its work and failure result; a transfer failure MUST NOT prevent either GC subtask from running, and a GC failure MUST NOT prevent the other subtasks. This is not a general job-management framework.
    attributes:
      subtasks: [transfer-queue-processing, Capacity-GC, Orphan-Invalid-GC]
      shared_behavior: [start, schedule]
      remote_transfer_triggers: [idle-interval, periodic-check, maximum-delivery-delay]
      remote_parallelism: configurable
      failure_isolation: independent-per-subtask
      general_job_framework: prohibited
    provenance:
      origin: imported
  - id: DES-GCS-READ-THROUGH
    level: system_design
    kind: read-through-protocol
    statement: Remote delivery reads prefer Local. On a Local miss, the Repository obtains RLocks for the content ID and shared temporary ID, downloads the complete object from the selected remote backend to temporary storage, validates bytes against the content ID, and publishes Local with no-replace semantics before Get or Cat consumes it. A failed, interrupted, or partial download never becomes a visible Local Object. An in-flight request may complete after Lease expiry; a subsequent GCS 404 is a local read failure and does not alter Metadata. Get continues to use its existing atomic destination-file publication; Cat may expose a response prefix if its downstream writer fails after bytes have been written. Direct remote-to-Get streaming is unnecessary in this design; whether any later progress-following stream should be exposed is deferred.
    attributes:
      local_first: true
      download_staging: repository-shared-temp
      publish: complete-verified-no-replace
      get_export: existing-atomic-destination-contract
      cat_response_rollback: unavailable-after-writer-accepted-bytes
    provenance:
      origin: imported
  - id: DES-METADATA-BACKEND-PORTABILITY
    level: system_design
    kind: metadata-adapter-contract
    statement: MetadataStore remains the semantic boundary for logical Entry state and the content-ID transfer queue while SQLite remains the current implementation. SQLite transactions, SQL, UNIQUE errors, and schema details do not leak through the common API. Every adapter must provide atomic conditional Create, Update, Move, and Delete semantics; expected-revision checks, sibling uniqueness, parent existence/kind, and ancestry-cycle validation are evaluated atomically with the mutation. The semantic API atomically commits a Put Entry mutation with transfer-queue enqueue and deletes the queue row after GCS API-contract completion; SQLite uses one transaction in the existing Metadata database and alternate adapters provide equivalent atomicity. Repository coordination and consistent reference enumeration required by GC must also be defined for any alternate backend. Firestore implementation details and distributed coordination are not selected here.
    attributes:
      current_adapter: SQLite
      candidate_adapter: Firestore
      exposed_api: MetadataStore
      forbidden_contract_leaks: [SQL, SQLite-transaction-types, backend-constraint-error-codes]
      metadata_backup_owner: operator
      backup_scope: [Entries, Repository-Format, content-ID-transfer-queue]
    provenance:
      origin: imported
  - id: DES-READ-SEMANTICS
    level: system_design
    kind: read-protocol
    statement: Read consistency, Object availability, and GC safety are distinct properties; rechecking an Entry revision alone guarantees neither Object availability nor GC safety.
    provenance:
      origin: imported
  - id: DES-FAILURE-BOUNDARIES
    level: system_design
    kind: failure-model
    statement: Logical Repository operation progress is not persisted. Before Local Object Commit, incomplete temporary data is cleanup-only. After Local Object Commit and before Metadata Commit, the unreferenced Object remains protected by the Put-held content-ID RLock; it becomes GC-eligible only after that lock is released or expires. After Metadata Commit, the Entry is published immediately and the content-ID transfer obligation is already atomically queued in the MetadataStore. The periodic Maintenance Job retries the row until GCS API-contract completion, then deletes it.
    provenance:
      origin: imported
  - id: DES-REVISION-SEMANTICS
    level: system_design
    kind: metadata-versioning
    statement: Revision is a per-Entry monotonically increasing uint64; no fixed step such as plus one is guaranteed, child changes do not advance the parent revision, and revisions do not provide Object availability or GC protection.
    provenance:
      origin: imported
  - id: DES-TIMESTAMP-REPRESENTATION
    level: system_design
    kind: metadata-representation
    statement: Persisted timestamp values use Unix nanoseconds where their unit must be explicit; this does not guarantee monotonic wall-clock behavior or cross-host ordering.
    provenance:
      origin: imported
  - id: DES-EXPLICIT-DIRECTORY-MODEL
    level: system_design
    kind: namespace-model
    statement: Directories are first-class Metadata Store Entries, including empty directories; the root is a directory Entry and directories have no Object reference.
    provenance:
      origin: imported
  - id: DES-PHASE5-DIRECTORIES
    level: system_design
    kind: roadmap-phase
    statement: Phase 5 implements the accepted explicit-directory model across commands and stores.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 5
      phase_status: planned
      phase_goals:
        - define root semantics
        - provide mkdir where needed by the interface
        - define parent creation and validation
        - constrain file-only and directory-only metadata fields
        - make subtree move and delete conflict-safe
        - reject moves into own subtree
        - test literal percent and underscore path handling
      exit_criteria:
        - consistent explicit-directory model across commands and stores
        - enforce root, parent-kind, namespace, and ancestry-cycle invariants
        - preserve hierarchy invariants during subtree moves and deletes
  - id: DES-IDENTITY-TARGET
    level: system_design
    kind: repository-format
    statement: The Phase 1 target is SHA-256 content identity with algorithm-namespaced object identifiers; existing identifiers must not be silently reinterpreted.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 1
      target_algorithm: sha256
  - id: DES-PHASE1-FORMAT
    level: system_design
    kind: roadmap-phase
    statement: Phase 1 introduces repository-owned format configuration and versioning, SHA-256 algorithm-namespaced identity, real SQLite schema migrations, and explicit rejection of unsupported formats.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 1
      exit_criteria:
        - open only repositories with compatible format semantics
        - do not silently reinterpret the digest algorithm
        - bind IDs unambiguously to their digest algorithm
        - cover every supported format transition with migration tests
  - id: DES-PHASE2-CAS
    level: system_design
    kind: roadmap-phase
    statement: Phase 2 establishes correct local CAS Commit through byte-derived identity, atomic publication, immutable verified reuse, safe concurrent identical commits, committed-only enumeration, and post-Commit Open and Exists visibility.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 2
      exit_criteria:
        - interrupted writes never expose partial committed Objects
        - committed bytes match their content identifier
        - repeated identical commits are idempotent
        - concurrent publication never overwrites committed content
        - corruption is detected before reusing an Object
        - enumeration exposes committed Objects only
  - id: DES-PHASE3-EXCLUSION
    level: system_design
    kind: roadmap-phase
    statement: The current Phase 3 implementation provides Repository-owned cross-process exclusion through a dedicated SQLite coordination database per repository. BEGIN IMMEDIATE serializes protected Commit and Repository operations across processes and Repository instances; the Metadata database remains separate and is not blocked by coordination transactions. Put Stage runs outside this exclusive lock under an operation-scoped Lease; Put Commit, Get, the full Cat read, GC, and Doctor run under exclusive coordination. Put Lease heartbeats use a separate SQLite database so long coordinated reads do not block renewal. This is the shipped single-host baseline; the Phase 6 target replaces full-operation read exclusion with the unified Resource Lease model while preserving GC safety. The design boundary permits a future shared/exclusive mode, but the current implementation is exclusive-only.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 3
      persistent_operation_progress: prohibited
      ephemeral_lease_record_fields: [operation_id, expires_at]
      optional_hash_lease_role: any-duplicate-transfer-coordination-uses-unified-resource-lease-model
      current_put_stage_lease: implementation-observation-only;target-uses-unified-resource-lease
      coordination_database: dedicated-SQLite-coordination.db
      coordination_transaction: BEGIN-IMMEDIATE
      transaction_release: ROLLBACK-on-success-error-cancel-or-panic
      release_failure: discard-connection-and-report-ErrRelease;operation-may-have-completed;attach-to-panic-when-panicking
      coordination_scope: all-processes-and-instances-sharing-one-repository
      protected_operations: [Put-Commit, Get, Cat, GC, Doctor]
      put_lease_database: put-leases.db
      initial_lock_mode: exclusive
      filesystem_scope: local-filesystem-only
      unsupported_conditions:
        - coordination-db-deleted-and-recreated-during-use-may-create-split-brain
        - direct-external-metadata-or-object-store-modification
        - multi-host-or-network-filesystem-coordination
      blocking_tradeoffs:
        - long-Get-or-Cat-blocks-Put-Get-GC-and-Doctor
        - all-protected-operations-are-serialized
      superseded_by_target:
        phase: 6
        target: resource-RWLocks-protect-objects-and-temporary-paths-without-holding-coordination-during-long-I-O
      exit_criteria:
        - concurrent Put Stages do not hold Repository-wide exclusive coordination
        - stale Stage cannot renew or publish after Lease expiry or invalidation
        - Lease cleanup invalidates before removal and is safe to retry after interruption
        - Put Commit lease validation and expiry invalidation serialize under Repository coordination
        - multiple-Repository-instance and multi-process tests protect Put through Object Commit and Metadata Commit
        - active Cat and Get remain protected from GC deletion for the full Object read
        - Doctor reference and Object observations cannot race with GC or Put
        - context cancellation and deadlines stop waiting for coordination
        - panic and process termination release coordination for later operations
        - coordination writer transactions do not block Metadata database writers
        - replacement failure before Metadata Commit preserves the old Entry
        - successful Metadata Commit references an already committed readable Object
        - correctness does not depend on process-local mutexes
        - coordination database recreation and direct external store mutation are documented outside the guarantee
  - id: DES-PHASE4-CLEANUP-EXPORT
    level: system_design
    kind: roadmap-phase
    statement: Phase 4 verifies failure outcomes at Object and Metadata commit boundaries, preserves Repository-owned exclusion, implements atomic Get destination replacement, and keeps Doctor non-destructive with valid unreferenced Objects assigned to GC. It introduces no generic Repair, tombstone retention, metadata compaction, persisted operation journal, or operation resumption. Lease-invalidated staging may be removed while a Stage still holds an open file; the Put may fail, but the removed path cannot be recreated or published by that Stage.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 4
      phase_goals:
        - test Object Commit and Metadata Commit failure boundaries, including replacement preservation
        - atomically replace Get destinations only after content and attributes are ready
        - verify Doctor is non-destructive and excludes valid unreferenced Objects
        - verify GC partial failure can be retried without deleting reachable Objects
        - keep Doctor and any future explicit repair operation separate
        - retain backend ownership of incomplete pre-Commit staging cleanup
      exit_criteria:
        - failure injection demonstrates the documented Object and Metadata commit-boundary outcomes
        - replacement failure before Metadata Commit preserves the old Entry and Object
        - Get uses a same-directory temporary file and atomic replacement on supported platforms
        - Get rejects symlink and directory destinations without changing them
        - Get failures preserve an existing regular-file destination and remove its temporary file
        - Doctor is non-destructive and does not report valid unreferenced Objects
        - GC partial deletion failure is safe to retry under Repository exclusion
        - no persisted operation progress is scanned, resumed, or introduced
        - expired staging is reclaimed after Lease invalidation; active Stage may fail but cannot recreate or Commit it
  - id: DES-PHASE6-GCS
    level: system_design
    kind: roadmap-phase
    statement: Phase 6 establishes Local/Remote delivery modes, single remote backend and bucket selection, capacity policy, resource leases, read-through, and garbage collection while keeping MetadataStore's logical namespace contract backend-independent. Each write commits a durable Local Object and atomically enqueues its content ID with the Metadata mutation; GCS payload transfer is selected by the idle synchronization scheduler rather than started for every write. The scheduler supports idle, periodic, and maximum-delay triggers, configurable parallelism, and final-object reconciliation before payload upload. Capacity GC and Orphan/Invalid GC remain independent subtasks. Phase 6 is the storage foundation for Phase A daemon adapters; it does not define Firestore or multi-daemon publication. Delayed in-flight I/O remains an accepted availability risk, not a fencing blocker.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 6
      exit_criteria:
        - Local mode runs without constructing, configuring, or contacting GCS
        - Remote-mode Put commits Local, Entry Metadata, and a content-ID transfer-queue item in one MetadataStore atomic operation before asynchronous transfer; SQLite uses the existing Metadata database and a single SQLite transaction
        - MetadataStore exposes backend-neutral atomic Put-and-enqueue and transfer-completion semantics; a Firestore adapter must provide equivalent transaction semantics without SQL leakage
        - idle synchronization scheduler retries each remaining queue row from complete Local content, honors configured idle/periodic/maximum-delay triggers and parallelism, reconciles existing final objects before payload upload, and deletes the obligation after authoritative GCS API success
        - direct resumable upload targets objects/{content_id}, uses no temporary GCS Object or copy, and never overwrites an existing live Object
        - existing-name and ambiguous upload responses converge through final-object API attributes; GCS generation and required API metadata are used for conditional operations
        - Remote-mode Get/Cat prefer Local; a miss downloads to shared temporary storage and publishes only complete content verified against its ID
        - Local capacity GC retains unconfirmed content and RLock-protected resources, and evicts only eligible confirmed replicas under a resource WLock
        - scheduled invalid-orphan GC applies only to Local artifacts; `nando admin recover` restores missing Metadata Entries under the configured recovery directory (default /recyclebin/<content-id>) without changing GCS objects
        - periodic Capacity GC checks Repository capacity settings and reclaims only needed eligible space; a Put/Download that encounters actual capacity exhaustion returns a capacity error without a reservation guarantee
        - MetadataStore conformance semantics include atomic revisions, namespace uniqueness, parent validation, and cycle rejection without SQL/API leakage
        - resource RLocks protect Put/Get/upload/download and resource WLocks protect GC physical deletion; lock state is managed atomically in SQLite and no second GC protection mechanism exists
        - Repository coordination is not held during long input, GCS network, download, or response I/O
        - the daemon maintenance scheduler runs GCS synchronization, Capacity GC, and Orphan/Invalid GC as independent subtasks; failure in one does not prevent the others
        - Local orphan GC rechecks pending content-ID delivery obligations under the content WLock and preserves queued Local sources even after their final Entry is removed
        - existing Local-only CAS, Get atomic export, Doctor, GC, CLI, and SQLite migration compatibility tests remain covered
  - id: DES-PHASE0-SCAFFOLDING
    level: system_design
    kind: roadmap-phase
    statement: Phase 0 establishes CLI and application/repository boundaries, SQLite metadata, a local Object Store, logical path normalization, and a basic command and test flow.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 0
      phase_status: current
  - id: DES-PHASE7-SYNC
    level: system_design
    kind: roadmap-phase
    statement: Phase 7 user-directed synchronization between repositories and remote repository operations remain deferred until authority, conflict resolution, snapshot boundaries, deletion propagation, offline mutation, authentication, and ownership semantics are defined. This is distinct from Phase A's one-way content-ID delivery to the selected remote object-storage backend (currently GCS), which is a storage durability mechanism and does not merge logical namespaces.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 7
      phase_status: deferred
  - id: DES-PHASE-A-DAEMON
    level: system_design
    kind: roadmap-phase
    statement: Phase A delivers one WSL Linux daemon for single-user local-host operation with SQLite Metadata, Local durable commits, immediate single-daemon visibility, standard per-user Unix-domain-socket JSON-RPC 2.0 (private parent directory mode 0700 and socket mode 0600), daemon-owned Resource sessions, and local file:// Resource URIs. TCP support remains available only with TLS and bearer authentication but its bind/certificate/token operations are outside standard Phase A operation. CLI, FUSE, and WebDAV are client processes; FUSE and WebDAV are separate Go modules and executables. The phase includes read-write FUSE/WebDAV clients and idle-scheduled remote delivery using the current GCS adapter and ADC, but their complete implementations may be delivered incrementally. WebDAV is plain HTTP restricted to loopback and serves the same local OS user; external publication, client authentication, TLS termination, and multi-user authorization are deferred. WebDAV PUT supports If-Match and If-None-Match against the Begin-time Repository CAS snapshot; unsupported conditional headers are explicitly rejected. It does not implement Firestore, multiple daemons, globally published heads, remote Resource transfer, cross-platform runtime support, or Cloud Run deployment.
    attributes:
      roadmap_phase: A
      phase_status: planned
      includes: [single-daemon, single-user-local-host, SQLite, Local-immediate-visibility, standard-JSON-RPC-UDS, daemon-owned-resource-sessions, file-Resource-URIs, separate-FUSE-module-and-process, separate-WebDAV-module-and-process, loopback-HTTP-WebDAV, Begin-CAS-conditional-PUT, idle-GCS-sync, ADC]
      excludes: [external-client-exposure, multi-user-authorization, WebDAV-client-authentication, WebDAV-TLS-termination, standard-TCP-operations, Firestore, multiple-daemons, Published-Head, remote-Resource-transfer, cross-platform, Cloud-Run]
      commit_boundary: [durable-Local-Object, atomic-Metadata-and-delivery-obligation]
      gcs_scheduler_settings: [idle-interval, periodic-check-interval, maximum-delivery-delay, parallelism]
      exit_criteria:
        - standard daemon clients use a per-user Unix socket under a private 0700 parent and the socket has mode 0600
        - WebDAV rejects non-loopback bind addresses and exposes no client-authentication or TLS claim
        - WebDAV If-Match and If-None-Match are evaluated against the Begin-time CAS snapshot and Commit conflict returns a precondition failure
        - unsupported WebDAV conditional headers are explicitly rejected rather than silently ignored
        - TCP listener remains unavailable unless TLS and bearer authentication are configured; TCP credential lifecycle is not a standard Phase A acceptance item
    provenance:
      origin: human-authored
  - id: DES-PHASE-B-PUBLISHED-HEAD
    level: system_design
    kind: roadmap-phase
    statement: Phase B adds a shared metadata backend such as Firestore and multiple daemons. It defines and implements Local Commit separately from Global Publish, stores daemon-local pending versions without exposing them as shared committed Entries, advances an explicit Published Head only after the new content is globally durable, and retains the previous Published Head until that transition is atomic. Distributed write conflicts, leases, GC snapshots, and publication coordination are Phase B requirements; Phase A SQLite behavior must not be presented as satisfying them.
    attributes:
      roadmap_phase: B
      phase_status: deferred
      prerequisites: [DES-PHASE-A-DAEMON, DES-LOCAL-COMMIT-GLOBAL-PUBLISH]
      includes: [shared-metadata-backend, multiple-daemons, local-pending-version, Published-Head, atomic-global-publish, distributed-coordination]
      firestore_adapter_implementation: deferred
    provenance:
      origin: human-authored
  - id: DES-CROSS-CUTTING-VALIDATION
    level: system_design
    kind: verification-strategy
    statement: Implementation phases validate Object Store conformance, committed-only Metadata behavior, multi-process Repository interleavings, stable CLI behavior, and each durable failure boundary at the narrowest responsible layer.
    provenance:
      origin: imported
    attributes:
      test_areas:
        - Object Store commit, visibility, verification, idempotency, cleanup, enumeration
        - Metadata committed-only transitions, revisions, conflicts, migrations, rollback
        - Repository Put, replacement, Read, remove, GC interleavings
        - CLI exit-code mapping and data-stream behavior
        - failure injection before Object Commit, between Object and Metadata Commit, and after Metadata Commit
  - id: DES-DEFERRED-OPTIMIZATIONS
    level: system_design
    kind: optimization-boundary
    statement: Hash fan-out tuning, parallel verification, batched GC, GCS listing optimization, additional metadata indexes, content-type detection, remote read caching, and optional duplicate-transfer coordination using the Resource Lease model follow correctness work and must not redefine visibility, commit, exclusion, or GC semantics.
    provenance:
      origin: imported
    attributes:
      deferred_optimizations:
        - hash fan-out directory tuning
        - parallel verification
        - batched GC deletion
        - GCS listing optimization
        - metadata indexes beyond observed need
        - content-type detection improvements
        - remote read caching
        - optional per-content transfer coordination using the Resource Lease model
  - id: DES-PATH-SEMANTICS
    level: system_design
    kind: path-model
    statement: Logical repository paths use forward slashes on every platform, are absolute and normalized by resolving duplicate separators, dot segments, and parent segments, are case-sensitive, and cannot escape the repository root.
    provenance:
      origin: imported

