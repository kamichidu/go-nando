contract_version: 1alpha1
schema_ref:
  revision: 455ed318b7bc409d3e1da320620ef92d457042b9
  sha256: 9b109dbc7ac09b32d3dbe2e233eed7da1378bc912d0e84c479c3ed0bed9f7103
model:
  id: go-nando
  title: go-nando repository design
  description: Canonical semantic design for repository authority, storage contracts, operation consistency, failure outcomes, and implementation roadmap.
  domain: file repository
  profile: repository-system-design
nodes:
  - id: REQ-META-SSOT
    level: system_requirement
    kind: authority-invariant
    statement: The Metadata Store MUST be the sole source of truth for committed Entries and the logical namespace; object presence or layout MUST NOT determine logical visibility.
    provenance:
      origin: imported
  - id: REQ-META-COMMITTED-ONLY
    level: system_requirement
    kind: persistence-invariant
    statement: The Metadata Store MUST persist committed Entries only and MUST NOT persist Pending Entries or other in-progress Repository operation state.
    provenance:
      origin: imported
  - id: REQ-OBJECT-SSOT
    level: system_requirement
    kind: authority-invariant
    statement: The Object Store replica set MUST own the immutable bytes identified by each content ID. The delivery mode defines which physical replica is authoritative or required for durability; physical Object placement MUST NOT determine logical Entry visibility, which remains Metadata Store authority.
    provenance:
      origin: imported
  - id: REQ-OBJECT-COMMIT
    level: system_requirement
    kind: commit-invariant
    statement: A successful Object Store Commit MUST atomically publish a complete immutable Object, and subsequent Open MUST read it while Exists MUST report it present.
    provenance:
      origin: imported
  - id: REQ-METADATA-ORDER
    level: system_requirement
    kind: commit-invariant
    statement: Repository metadata MUST NOT commit a reference to an Object before that Object has successfully committed.
    provenance:
      origin: imported
  - id: REQ-REVISION
    level: system_requirement
    kind: version-invariant
    statement: Entry revisions MUST be initialized to a valid uint64 value at creation and MUST increase monotonically after successful writes affecting that Entry, without requiring an exact increment size.
    provenance:
      origin: imported
  - id: REQ-PUT-GC-EXCLUSION
    level: system_requirement
    kind: concurrency-invariant
    statement: A resource-scoped expiring RWLock MUST protect every content ID or temporary path used by Put, Get, upload, or download. These operations MUST hold an RLock for each resource they depend on. GC physical deletion MUST hold a WLock for the same resource ID. Lock acquisition, renewal, and release MUST be atomic through SQLite transactions; a WLock acquisition MUST exclude all RLocks and other WLocks for that resource. Lease renewal failure MUST stop the protected operation. Long-running input, upload, download, or response I/O MUST NOT hold Repository-wide exclusive coordination. An expired WLock MUST NOT authorize a stale GC worker to delete after a newer lock or access has been granted; the deletion fencing rule remains to be specified.
    provenance:
      origin: imported
  - id: REQ-READ-GC-EXCLUSION
    level: system_requirement
    kind: concurrency-invariant
    statement: Get, Cat, and download MUST hold renewable RLocks for each content ID and temporary path they still need until access ends. GC MUST acquire the corresponding WLock before physical deletion. Renewal failure MUST stop the operation and MUST NOT publish partial downloaded content. Long-running response or network I/O MUST NOT hold Repository-wide exclusive coordination.
    provenance:
      origin: imported
  - id: REQ-EXPLICIT-DIRECTORIES
    level: system_requirement
    kind: namespace-invariant
    statement: The logical namespace MUST use explicit first-class directory Entries and preserve empty directories.
    provenance:
      origin: imported
  - id: REQ-REPLACEMENT
    level: system_requirement
    kind: commit-invariant
    statement: When replacing an Entry's content, the old committed Entry MUST remain authoritative until the new Object is committed and the replacement Metadata Commit succeeds.
    provenance:
      origin: imported
  - id: REQ-NO-RESUME
    level: system_requirement
    kind: failure-invariant
    statement: Repository operations MUST NOT persist logical-operation progress for later resumption; interruption is handled according to the last committed boundary. GCS replication may persist content-ID-level delivery obligation and confirmation so unfinished content can be rediscovered and a fresh idempotent transfer attempted; this is not resumption of the original Put and does not create Pending Entries.
    provenance:
      origin: imported
  - id: REQ-PUT-STAGE-LEASE
    level: system_requirement
    kind: concurrency-invariant
    statement: Put input staging MUST occur outside Repository-wide exclusive coordination and MUST NOT publish content or metadata unless its operation-scoped SQLite Lease is still valid when Commit begins under exclusive coordination. This operation-scoped Lease fences Put Commit and staging cleanup only; it is not the resource RWLock and MUST NOT be used as GC protection. The SQLite Lease is the sole authority to Commit. Lease renewal MUST be conditional on the same unexpired operation ID and MUST NOT resurrect an expired or invalidated Lease. Expiration invalidation MUST be serialized with Commit. Each Stage MUST create its operation-ID-specific staging path exactly once and MUST write only through that already-open file; it MUST NOT reopen or recreate the path after removal. A missing staging path causes Put failure. Cleanup MAY remove staging while a Stage is writing because staging is disposable, but MUST NOT permit an expired or invalidated Lease to publish content or Metadata.
    provenance:
      origin: imported
  - id: REQ-DELIVERY-MODES
    level: system_requirement
    kind: deployment-invariant
    statement: The repository MUST support a Local delivery mode in which GCS is absent and Local is the authoritative durable Object Store, and a GCS delivery mode in which Put first commits complete content to Local and commits Metadata for immediate visibility before asynchronous GCS replication.
    provenance:
      origin: imported
  - id: REQ-REPLICATION-OBLIGATION
    level: system_requirement
    kind: persistence-invariant
    statement: GCS delivery obligations MUST be stored in a persistent transfer queue keyed by content ID and MUST be atomically enqueued in the same Metadata transaction that commits the Put Entry. The MetadataStore semantic API MUST expose this atomic operation without exposing SQL or SQLite transaction types; alternate adapters MUST provide equivalent transaction semantics. Queue state MUST support restart rediscovery, retry, and recording verified completion. It MUST NOT represent logical Entries as Pending or promise resumption of the original Put operation; retry from a complete committed Local Object MUST be idempotent.
    provenance:
      origin: imported
  - id: REQ-GCS-PUBLICATION
    level: system_requirement
    kind: object-publication-invariant
    statement: GCS upload MUST begin only after the content ID is known, MUST use a resumable upload directly to objects/{content_id}, MUST NOT create a temporary GCS Object or copy one, and MUST NOT replace an existing live Object. A transfer MUST NOT be recorded as confirmed until upload completion and the selected remote verification contract have succeeded.
    provenance:
      origin: imported
  - id: REQ-LOCAL-CAPACITY-GC
    level: system_requirement
    kind: garbage-collection-invariant
    statement: Capacity GC and invalid-orphan GC MUST be distinct operations. Capacity GC MUST NOT remove a Local authoritative Object in Local mode, an Object without confirmed GCS delivery in GCS mode, or any RLock-protected resource. It MAY evict a GCS-delivered Local cache Object only after the required GCS confirmation. If capacity cannot be released without violating these conditions, the requesting operation MUST fail with a capacity error. Repository GC MUST NOT delete the last known-good physical Object copy.
    provenance:
      origin: imported
  - id: REQ-READ-THROUGH
    level: system_requirement
    kind: read-path-invariant
    statement: In GCS delivery mode, Get and Cat MUST prefer a complete Local Object. If it is absent, the Repository MUST acquire RLocks for the content ID and shared temporary ID, download to shared temporary storage, verify the complete bytes against the content ID, and publish the Local Object without replacement before serving it. A partial download MUST never become a committed Local Object. A direct GCS-to-Get destination streaming path is not required; progress-following streaming remains an optional future design.
    provenance:
      origin: imported
  - id: REQ-LOCAL-GCS-IMMUTABILITY
    level: system_requirement
    kind: immutability-invariant
    statement: Local and GCS publication for a content ID MUST be no-replace. A pre-existing Object MUST be verified against the requested content ID before it can count as an idempotent success. GCS deletion MUST be conditional on the exact observed Object generation so a concurrent replacement cannot be deleted accidentally.
    provenance:
      origin: imported
  - id: REQ-METADATA-PORTABILITY
    level: system_requirement
    kind: backend-contract
    statement: MetadataStore implementations MUST provide the same observable operation and atomicity semantics for Entry creation, update, move, and deletion, including revision comparison and namespace/hierarchy invariants. Repository contracts MUST NOT expose SQLite transaction, SQL, or constraint details; each adapter MUST enforce state-dependent validation atomically with its mutation using backend-native mechanisms.
    provenance:
      origin: imported
  - id: REQ-METADATA-BACKUP-RESPONSIBILITY
    level: system_requirement
    kind: operations-boundary
    statement: Metadata backup and restoration are operator responsibilities; backup procedures MUST preserve the association between committed Entry Object IDs, Repository Format, and replication state required by the selected delivery mode.
    provenance:
      origin: imported
  - id: REQ-ENTRY-ID
    level: system_requirement
    kind: identity-invariant
    statement: Every Entry MUST have a globally unique, opaque immutable identifier that remains unchanged throughout the Entry lifecycle.
    provenance:
      origin: imported
  - id: REQ-NAMESPACE-UNIQUENESS
    level: system_requirement
    kind: namespace-invariant
    statement: No two Entries MUST have the same name under the same parent directory, and Entry hierarchy MUST remain valid and acyclic.
    provenance:
      origin: imported
  - id: REQ-ROOT-ENTRY
    level: system_requirement
    kind: namespace-invariant
    statement: The logical namespace MUST have a first-class root directory Entry.
    provenance:
      origin: imported
  - id: REQ-DIRECTORY-NO-OBJECT
    level: system_requirement
    kind: namespace-invariant
    statement: A directory Entry MUST NOT reference content in the Object Store.
    provenance:
      origin: imported
  - id: REQ-SUBTREE-MUTATIONS
    level: system_requirement
    kind: namespace-invariant
    statement: Move and Remove MUST enforce conflicts across the affected subtree and MUST reject moving an Entry into its own descendant subtree.
    provenance:
      origin: imported
  - id: REQ-GET-ATOMIC-DESTINATION
    level: system_requirement
    kind: export-invariant
    statement: Get MUST write to a temporary file in the destination directory, set its required attributes, and atomically replace an existing regular-file destination only after successful completion; an absent destination is created, symlink and directory destinations are rejected without changing the link or its target, and failures before replacement preserve an existing regular-file destination and clean up the temporary file. A cleanup failure after successful replacement MUST identify that the destination was already published.
    provenance:
      origin: imported
  - id: REQ-DOCTOR-NONDESTRUCTIVE
    level: system_requirement
    kind: diagnostic-invariant
    statement: Doctor MUST validate repository integrity without mutating repository state unless an explicit repair mode is invoked.
    provenance:
      origin: imported

  - id: DES-REPOSITORY-BOUNDARIES
    level: system_design
    kind: responsibility-model
    statement: The Repository owns cross-store consistency, commit ordering, process-wide operation exclusion, and Repository Format meaning and compatibility policy; the Application performs use-case orchestration.
    provenance:
      origin: imported
    attributes:
      deployment_scope: single-host-single-repository
      exclusion_scope: cross-process
      unsupported_initial_capabilities:
        - distributed metadata writes
        - multi-host transactional coordination
        - transparent filesystem mounting
        - remote concurrent writers
        - user-visible version history
      coordination:
        authority: Repository
        storage: dedicated-SQLite-coordination-db
        filename: coordination.db
        transaction: BEGIN-IMMEDIATE
        transaction_release: ROLLBACK-on-success-error-cancel-or-panic
        release_failure: discard-connection-and-report-ErrRelease;operation-may-have-completed;attach-to-panic-when-panicking
        scope: all-processes-and-Repository-instances-for-one-repository
        filesystem: local-filesystem-only
        protected_operations: [Put-Commit, Get, Cat, GC, Doctor]
        mode: exclusive-for-all-protected-operations
        shared-mode: future-extension-boundary-only
        metadata-database: separate-from-coordination-database
        cancellation: context-cancellation-or-deadline-stops-lock-wait
        process-termination: SQLite-releases-lock
        panic: rollback-and-release-lock
        unsupported:
          - deleting-and-recreating-coordination-db-while-repository-is-in-use
          - direct-external-metadata-or-object-store-modification
          - multi-host-or-network-filesystem-coordination
        tradeoffs:
          - long-Get-or-Cat-blocks-Put-Get-GC-and-Doctor
          - exclusive-serialization-sacrifices-concurrent-reads
      put_staging_lease:
        storage: separate-SQLite-database
        filename: put-leases.db
        rationale: lease-heartbeat-must-not-be-blocked-by-long-coordinated-reads
        persistent_fields: [operation_id, expires_at]
        prohibited_fields: [input-progress, content-result, metadata-result, resumable-state]
  - id: DES-CLI-BOUNDARY
    level: system_design
    kind: responsibility-model
    statement: CLI owns argument parsing, input normalization, dependency construction, exit-code mapping, and stream wiring; it does not execute SQL, derive content IDs, decide object reachability, or implement recovery policy.
    attributes:
      exit_codes:
        success: 0
        general_failure: 1
        invalid_arguments: 2
        entry_or_object_not_found: 3
        conflict: 4
        corruption_or_verification_failure: 5
    provenance:
      origin: imported
  - id: DES-APPLICATION-BOUNDARY
    level: system_design
    kind: responsibility-model
    statement: Application exposes repository use cases and owns use-case orchestration and operation input/output models, while Repository-wide consistency and exclusion remain Repository responsibilities.
  - id: DES-DEPENDENCY-DIRECTION
    level: system_design
    kind: component-model
    statement: Runtime dependency direction is CLI to Application to Repository to Metadata Store, Object Store, and Content Identity, with CLI also depending on Paths and Runtime Config; concrete storage packages depend on interfaces and domain values, and core Repository logic does not depend on CLI.
    attributes:
      dependency_edges:
        - [CLI, Application]
        - [Application, Repository]
        - [Repository, Metadata Store]
        - [Repository, Object Store]
        - [Repository, Content Identity]
        - [CLI, Paths]
        - [CLI, Runtime Config]
  - id: DES-CONSTRUCTION
    level: system_design
    kind: composition-root
    statement: The executable composition root reads persisted Repository Format metadata, validates its meaning and compatibility before use, then composes the metadata backend, object backend, digest algorithm, and Repository. The SQLite adapter owns only SQLite schema migrations and persistence of Repository Format values; backend selection is planned to use repository-owned configuration distinct from per-user runtime configuration.
    attributes:
      current_backends: [SQLite, local filesystem Object Store]
      planned_backend_selection: repository-owned-configuration
    provenance:
      origin: imported
  - id: DES-METADATA-MODEL
    level: system_design
    kind: metadata-model
    statement: Entry IDs are globally unique opaque internal identifiers; parent-child relationships are authoritative, logical paths are derived, sibling names are unique, and canonical path caches are disposable derived data.
    provenance:
      origin: imported
    attributes:
      current_entry_id_implementation: UUIDv4
  - id: DES-OBJECT-MODEL
    level: system_design
    kind: object-model
    statement: Object Stores own immutable content bytes identified by algorithm-namespaced content IDs, independent of logical names or paths. Local and GCS are physical replicas whose required durability role depends on delivery mode; committed immutable publication, verification, enumeration, and deletion never assign logical paths.
    provenance:
      origin: imported
  - id: DES-DOCTOR
    level: system_design
    kind: diagnostic-contract
    statement: Doctor checks Repository health by validating committed metadata references, referenced Object content identity, logical metadata invariants, and supported Repository Format before reporting healthy. It is non-destructive; repair is outside Doctor and requires a separate explicit operation. Valid unreferenced committed Objects are not Doctor findings and remain GC's responsibility.
    provenance:
      origin: imported
  - id: DES-ERROR-MODEL
    level: system_design
    kind: error-contract
    statement: Domain errors are typed or sentinel errors mapped at the CLI boundary; message-text matching is not the primary corruption or verification classification mechanism.
    attributes:
      stable_categories:
        - invalid arguments
        - Entry or Object not found
        - path conflict
        - repository corruption
        - unsupported repository format
        - repository busy or locked
      coordination_errors:
        acquisition: ErrAcquire-wraps-context-and-SQLite-causes
        callback: ErrOperation-wraps-the-callback-cause
        release: ErrRelease;callback-success-may-already-be-reflected;release-failures-attach-to-panic
    provenance:
      origin: imported
  - id: DES-SCAFFOLDING-BOUNDARY
    level: system_design
    kind: implementation-scope
    statement: Scaffolding avoids placeholder packages unless they establish a compile-time contract used by current code; architecture is expressed through explicit interfaces, invariants, and tests.
    provenance:
      origin: imported
  - id: DES-OBJECT-BACKEND-NEUTRALITY
    level: system_design
    kind: backend-contract
    statement: Object staging mechanisms, physical layout, and prefix or bucket separation are backend-internal choices and are not Repository-wide contracts.
    provenance:
      origin: imported
  - id: DES-OBJECT-CONSISTENCY
    level: system_design
    kind: backend-contract
    statement: Object Store consistency and availability beyond successful Commit visibility are backend-specific; the shared design does not classify all Object Stores as eventually consistent.
    provenance:
      origin: imported
  - id: DES-LEASE
    level: system_design
    kind: optimization-boundary
    statement: An optional per-hash Lease may suppress duplicate transfer work only and provides no cross-store consistency, Repository exclusion, or GC protection; when used, it has an absolute UTC ExpiresAt, is valid only while ExpiresAt is later than now, and may terminate by explicit release or natural expiration.
    attributes:
      expiration_representation: absolute-utc-timestamp
      failed_or_aborted_commit: lease-may-expire-naturally
    provenance:
      origin: imported
  - id: DES-PUT-STAGE-COMMIT
    level: system_design
    kind: put-lifecycle
    statement: In the current Local-only implementation, Put creates one operation-ID-specific staging file and uses an operation-scoped SQLite Lease while copying and hashing outside Repository-wide exclusive coordination; Stage never reopens or recreates the path. Its coordinated Commit validates the unexpired Lease, publishes Local content, then commits Metadata. In GCS mode the target preserves Local publication first, then atomically commits the Entry and content-ID transfer-queue item through MetadataStore before asynchronous transfer. The operation-scoped Put Lease remains a Commit/staging fence; resource RWLocks alone protect resources from GC. GCS delivery status is independent of logical Entry identity and does not make Put resumable or exactly-once.
    attributes:
      lease_ttl: 30-seconds
      renewal_interval: 10-seconds
      lease_kind: operation-lifecycle-fence-distinct-from-optional-per-hash-transfer-Lease
      expiry_clock: SQLite-database-UTC-unix-milliseconds
      cancellation: stop-renewal;invalidate-own-lease;clean-own-staging;do-not-resume
      expiry_invalidation: under-Repository-exclusive-coordination-before-staging-cleanup
      renewal_condition: operation-id-matches-and-lease-is-unexpired
      staging_creation: one-time-O_EXCL-operation-ID-path-before-Lease-acquisition
      staging_write: existing-open-file-descriptor-only;never-reopen-or-recreate-path
      commit_fencing: validate-lease-after-exclusive-acquisition-before-Commit-mutations
      expired_or_invalidated_lease: terminal-cannot-be-renewed
      cleanup:
        trigger: before-each-Put-Stage-and-before-GC
        actions:
          - atomically-set-expired-lease-expiry-to-zero-before-filesystem-removal
          - cleanup-may-remove-staging-during-active-Stage;Put-may-fail
          - retain-invalidated-lease-row-if-staging-removal-fails;retry-removal-later
          - remove-invalidated-lease-row-only-after-staging-collection-succeeds
          - remove-orphan-staging-with-no-active-lease;never-recreate-a-removed-path
          - Lease-invalidation-and-Commit-lease-validation-are-serialized-by-Repository-coordination;filesystem-removal-follows-invalidation
          - retry-after-crash-or-removal-error-is-idempotent
      unsupported:
        - external-deletion-or-recreation-of-put-leases-db-while-in-use
        - lease-as-Object-availability-or-GC-protection
    provenance:
      origin: imported
  - id: DES-DELIVERY-MODES
    level: system_design
    kind: storage-delivery-model
    statement: Local delivery mode has no GCS dependency and treats Local as the durable authoritative Object copy. GCS delivery mode first persists a complete immutable Local Object and commits Metadata, making the Entry immediately visible; asynchronous transfer then establishes a GCS replica. Local data remains the only known-good copy until GCS delivery is confirmed. After confirmation, Local may act as an evictable cache while Metadata remains the authority for logical Entries and paths. A content ID can be referenced by multiple Entries and is transferred once per content identity, independent of logical names.
    attributes:
      modes: [local, gcs]
      local_mode: [GCS-absent, Local-authoritative]
      gcs_mode_put_order: [Local-Stage-and-hash, Local-no-replace-publication, Metadata-Commit, asynchronous-GCS-transfer]
      gcs_mode_visibility: Metadata-Commit
      pre_replication_failure: Local-physical-loss-may-lose-unreplicated-content
      local_cache_eviction: only-after-confirmed-GCS-delivery
      gcs_object_name: objects/{content_id}
      gcs_upload: resumable-direct-to-final-name;no-temporary-object-or-copy
      transfer_key: content-ID
      shared_temporary_storage: [Put-spool, GCS-download-staging]
      get_export_staging: destination-directory-temporary-file-per-REQ-GET-ATOMIC-DESTINATION
      gcs_direct_get_stream: not-required
      optional_streaming: progress-following-stream-design-may-be-considered-later
    provenance:
      origin: imported
  - id: DES-REPLICATION-STATE
    level: system_design
    kind: replica-state-model
    statement: GCS transfer obligation and confirmed delivery are persistent transfer-queue facts keyed by content ID in the MetadataStore authority. Put commits the Entry and ensures the queue item in one backend atomic transaction; the semantic MetadataStore API provides that operation without exposing SQL or SQLite transactions. SQLite stores both in the existing Metadata database; an alternate adapter must provide the same atomic observable result. A transfer is confirmed only after final-name upload completion and selected remote verification succeeds. Retries rediscover unconfirmed IDs after restart; repeated upload after ambiguous completion is no-replace and idempotent, and an existing Object is verified before acceptance. Queue state is not an Entry-level Pending state, Operation Record, or resumption of the original Put. Queue fields and retry policy remain open.
    attributes:
      confirmed_delivery_evidence_candidate: [GCS-generation, verification-result]
      absent_or_unconfirmed_state: must-be-re-discoverable-after-restart
      duplicate_transfer: allowed-if-no-replace-and-verified
      no_temporary_GCS_object: true
    provenance:
      origin: imported
  - id: DES-RESOURCE-LEASES
    level: system_design
    kind: gc-protection-protocol
    statement: Resource locks are keyed by the same content ID or temporary ID used by the protected operation. Put, Get, upload, and download hold expiring RLocks; GC holds an expiring WLock for physical deletion. RLock and WLock acquisition, renewal, and release are atomically managed in SQLite transactions, and a WLock is exclusive against all locks for that resource. Lock rows are the sole GC protection mechanism; no parallel Lease or reservation system duplicates it. Long input, network, and response I/O occurs without Repository-wide exclusive coordination. Renewal failure stops the operation. A stale GC worker whose WLock expires must be fenced from deleting after another lock is granted; the exact deletion fence remains open.
    attributes:
      lock_scope: resource-ID-content-or-temporary-ID
      lock_modes: [RLock-for-Put-Get-Cat-upload-download, WLock-for-GC-physical-delete]
      lock_fields: [operation-ID, mode, expiry]
      lock_storage: dedicated-resource-lock-area-in-SQLite-coordination-database;managed-by-SQLite-transactions
      operations: [Put, GCS-upload, GCS-download, Get, Cat, GC]
      heartbeat: renew-expiring-lock-while-resource-is-in-use
      renewal_failure: stop-operation;do-not-publish-partial-download
      coordination_long_io: prohibited
      duplicate_gc_protection_mechanism: prohibited
      stale_WLock: must-not-delete-after-expiry-and-new-grant
    provenance:
      origin: imported
  - id: DES-GC-CLASSES
    level: system_design
    kind: garbage-collection-model
    statement: Capacity GC and invalid-orphan GC have separate eligibility rules and outcomes. Capacity GC releases Local space only from eligible replicas and never deletes Local-mode authority, unconfirmed GCS-mode content, or RLock-protected resources; inability to reclaim safe capacity fails the requesting operation. Invalid-orphan GC reconciles malformed, corrupt, or unreferenced Local artifacts and unreferenced GCS Objects while respecting Metadata references, RLocks, and the last known-good physical copy. Physical deletion requires the resource WLock and targets the observed GCS Object generation. A WLock excludes concurrent RLocks and WLocks while valid; stale deletion fencing after expiry remains open.
    attributes:
      capacity_gc: [GCS-mode-only-eviction-of-confirmed-Local-cache-replicas, resource-RLock-aware]
      invalid_orphan_gc: [Local-invalid, Local-unreferenced, GCS-unreferenced, resource-WLock-before-physical-delete]
      Local_mode: no-capacity-eviction-of-authoritative-Objects
      last_known_good_copy: protected-from-Repository-GC
      gcs_delete: generation-conditional
      shared_protection_authority: resource-RWLock-only
    provenance:
      origin: imported
  - id: DES-GCS-READ-THROUGH
    level: system_design
    kind: read-through-protocol
    statement: GCS delivery reads prefer Local. On a Local miss, the Repository obtains RLocks for the content ID and shared temporary ID, downloads the complete GCS Object to temporary storage, validates bytes against the content ID, and publishes Local with no-replace semantics before Get or Cat consumes it. A failed, interrupted, or partial download never becomes a visible Local Object. Get continues to use its existing atomic destination-file publication; Cat may expose a response prefix if its downstream writer fails after bytes have been written. Direct GCS-to-Get streaming is unnecessary in this design; whether any later progress-following stream should be exposed is deferred.
    attributes:
      local_first: true
      download_staging: repository-shared-temp
      publish: complete-verified-no-replace
      get_export: existing-atomic-destination-contract
      cat_response_rollback: unavailable-after-writer-accepted-bytes
    provenance:
      origin: imported
  - id: DES-METADATA-BACKEND-PORTABILITY
    level: system_design
    kind: metadata-adapter-contract
    statement: MetadataStore remains the semantic boundary for logical Entry state and the content-ID transfer queue while SQLite remains the current implementation. SQLite transactions, SQL, UNIQUE errors, and schema details do not leak through the common API. Every adapter must provide atomic conditional Create, Update, Move, and Delete semantics; expected-revision checks, sibling uniqueness, parent existence/kind, and ancestry-cycle validation are evaluated atomically with the mutation. The semantic API also atomically commits a Put Entry mutation with transfer-queue enqueue and records verified transfer completion; SQLite uses one transaction in the existing Metadata database and alternate adapters provide equivalent atomicity. Repository coordination and consistent reference enumeration required by GC must also be defined for any alternate backend. Firestore implementation details and distributed coordination are not selected here.
    attributes:
      current_adapter: SQLite
      candidate_adapter: Firestore
      exposed_api: MetadataStore
      forbidden_contract_leaks: [SQL, SQLite-transaction-types, backend-constraint-error-codes]
      metadata_backup_owner: operator
      backup_scope: [Entries, Repository-Format, content-ID-transfer-queue]
    provenance:
      origin: imported
  - id: DES-READ-SEMANTICS
    level: system_design
    kind: read-protocol
    statement: Read consistency, Object availability, and GC safety are distinct properties; rechecking an Entry revision alone guarantees neither Object availability nor GC safety.
    provenance:
      origin: imported
  - id: DES-FAILURE-BOUNDARIES
    level: system_design
    kind: failure-model
    statement: Logical Repository operation progress is not persisted. Before Local Object Commit, incomplete temporary data is cleanup-only; after Local Object Commit and before Metadata Commit, the unreferenced Object remains protected by the Put-held resource RLock and becomes GC-eligible only after that lock is released or expires. The operation-scoped Put Lease fences Commit/staging cleanup but is not GC protection. After Metadata Commit, the Entry is published immediately; in GCS mode a content-ID queue item is committed atomically with Entry metadata and asynchronous replication follows.
    provenance:
      origin: imported
  - id: DES-REVISION-SEMANTICS
    level: system_design
    kind: metadata-versioning
    statement: Revision is a per-Entry monotonically increasing uint64; no fixed step such as plus one is guaranteed, child changes do not advance the parent revision, and revisions do not provide Object availability or GC protection.
    provenance:
      origin: imported
  - id: DES-TIMESTAMP-REPRESENTATION
    level: system_design
    kind: metadata-representation
    statement: Persisted timestamp values use Unix nanoseconds where their unit must be explicit; this does not guarantee monotonic wall-clock behavior or cross-host ordering.
    provenance:
      origin: imported
  - id: DES-EXPLICIT-DIRECTORY-MODEL
    level: system_design
    kind: namespace-model
    statement: Directories are first-class Metadata Store Entries, including empty directories; the root is a directory Entry and directories have no Object reference.
    provenance:
      origin: imported
  - id: DES-PHASE5-DIRECTORIES
    level: system_design
    kind: roadmap-phase
    statement: Phase 5 implements the accepted explicit-directory model across commands and stores.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 5
      phase_status: planned
      phase_goals:
        - define root semantics
        - provide mkdir where needed by the interface
        - define parent creation and validation
        - constrain file-only and directory-only metadata fields
        - make subtree move and delete conflict-safe
        - reject moves into own subtree
        - test literal percent and underscore path handling
      exit_criteria:
        - consistent explicit-directory model across commands and stores
        - enforce root, parent-kind, namespace, and ancestry-cycle invariants
        - preserve hierarchy invariants during subtree moves and deletes
  - id: DES-IDENTITY-TARGET
    level: system_design
    kind: repository-format
    statement: The Phase 1 target is SHA-256 content identity with algorithm-namespaced object identifiers; existing identifiers must not be silently reinterpreted.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 1
      target_algorithm: sha256
  - id: DES-PHASE1-FORMAT
    level: system_design
    kind: roadmap-phase
    statement: Phase 1 introduces repository-owned format configuration and versioning, SHA-256 algorithm-namespaced identity, real SQLite schema migrations, and explicit rejection of unsupported formats.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 1
      exit_criteria:
        - open only repositories with compatible format semantics
        - do not silently reinterpret the digest algorithm
        - bind IDs unambiguously to their digest algorithm
        - cover every supported format transition with migration tests
  - id: DES-PHASE2-CAS
    level: system_design
    kind: roadmap-phase
    statement: Phase 2 establishes correct local CAS Commit through byte-derived identity, atomic publication, immutable verified reuse, safe concurrent identical commits, committed-only enumeration, and post-Commit Open and Exists visibility.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 2
      exit_criteria:
        - interrupted writes never expose partial committed Objects
        - committed bytes match their content identifier
        - repeated identical commits are idempotent
        - concurrent publication never overwrites committed content
        - corruption is detected before reusing an Object
        - enumeration exposes committed Objects only
  - id: DES-PHASE3-EXCLUSION
    level: system_design
    kind: roadmap-phase
    statement: The current Phase 3 implementation provides Repository-owned cross-process exclusion through a dedicated SQLite coordination database per repository. BEGIN IMMEDIATE serializes protected Commit and Repository operations across processes and Repository instances; the Metadata database remains separate and is not blocked by coordination transactions. Put Stage runs outside this exclusive lock under an operation-scoped Lease; Put Commit, Get, the full Cat read, GC, and Doctor run under exclusive coordination. Put Lease heartbeats use a separate SQLite database so long coordinated reads do not block renewal. This is the shipped single-host baseline; the Phase 6 target replaces full-operation read exclusion with resource Leases while preserving GC safety. The design boundary permits a future shared/exclusive mode, but the current implementation is exclusive-only.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 3
      persistent_operation_progress: prohibited
      ephemeral_lease_record_fields: [operation_id, expires_at]
      optional_hash_lease_role: duplicate-transfer-suppression-only
      put_stage_lease_role: operation-scoped-staging-fence-and-cleanup-eligibility
      coordination_database: dedicated-SQLite-coordination.db
      coordination_transaction: BEGIN-IMMEDIATE
      transaction_release: ROLLBACK-on-success-error-cancel-or-panic
      release_failure: discard-connection-and-report-ErrRelease;operation-may-have-completed;attach-to-panic-when-panicking
      coordination_scope: all-processes-and-instances-sharing-one-repository
      protected_operations: [Put-Commit, Get, Cat, GC, Doctor]
      put_lease_database: put-leases.db
      initial_lock_mode: exclusive
      filesystem_scope: local-filesystem-only
      unsupported_conditions:
        - coordination-db-deleted-and-recreated-during-use-may-create-split-brain
        - direct-external-metadata-or-object-store-modification
        - multi-host-or-network-filesystem-coordination
      blocking_tradeoffs:
        - long-Get-or-Cat-blocks-Put-Get-GC-and-Doctor
        - all-protected-operations-are-serialized
      superseded_by_target:
        phase: 6
        target: resource-RWLocks-protect-objects-and-temporary-paths-without-holding-coordination-during-long-I-O
      exit_criteria:
        - concurrent Put Stages do not hold Repository-wide exclusive coordination
        - stale Stage cannot renew or publish after Lease expiry or invalidation
        - Lease cleanup invalidates before removal and is safe to retry after interruption
        - Put Commit lease validation and expiry invalidation serialize under Repository coordination
        - multiple-Repository-instance and multi-process tests protect Put through Object Commit and Metadata Commit
        - active Cat and Get remain protected from GC deletion for the full Object read
        - Doctor reference and Object observations cannot race with GC or Put
        - context cancellation and deadlines stop waiting for coordination
        - panic and process termination release coordination for later operations
        - coordination writer transactions do not block Metadata database writers
        - replacement failure before Metadata Commit preserves the old Entry
        - successful Metadata Commit references an already committed readable Object
        - correctness does not depend on process-local mutexes
        - coordination database recreation and direct external store mutation are documented outside the guarantee
  - id: DES-PHASE4-CLEANUP-EXPORT
    level: system_design
    kind: roadmap-phase
    statement: Phase 4 verifies failure outcomes at Object and Metadata commit boundaries, preserves Repository-owned exclusion, implements atomic Get destination replacement, and keeps Doctor non-destructive with valid unreferenced Objects assigned to GC. It introduces no generic Repair, tombstone retention, metadata compaction, persisted operation journal, or operation resumption. Lease-invalidated staging may be removed while a Stage still holds an open file; the Put may fail, but the removed path cannot be recreated or published by that Stage.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 4
      phase_goals:
        - test Object Commit and Metadata Commit failure boundaries, including replacement preservation
        - atomically replace Get destinations only after content and attributes are ready
        - verify Doctor is non-destructive and excludes valid unreferenced Objects
        - verify GC partial failure can be retried without deleting reachable Objects
        - keep Doctor and any future explicit repair operation separate
        - retain backend ownership of incomplete pre-Commit staging cleanup
      exit_criteria:
        - failure injection demonstrates the documented Object and Metadata commit-boundary outcomes
        - replacement failure before Metadata Commit preserves the old Entry and Object
        - Get uses a same-directory temporary file and atomic replacement on supported platforms
        - Get rejects symlink and directory destinations without changing them
        - Get failures preserve an existing regular-file destination and remove its temporary file
        - Doctor is non-destructive and does not report valid unreferenced Objects
        - GC partial deletion failure is safe to retry under Repository exclusion
        - no persisted operation progress is scanned, resumed, or introduced
        - expired staging is reclaimed after Lease invalidation; active Stage may fail but cannot recreate or Commit it
  - id: DES-PHASE6-GCS
    level: system_design
    kind: roadmap-phase
    statement: Phase 6 adds repository-selected Local and GCS delivery modes while keeping MetadataStore's logical namespace contract backend-independent. GCS mode commits Local content and atomically commits Metadata plus a content-ID transfer-queue item before asynchronous replication; the queue supports restart rediscovery, retry, and verified completion but does not resume the original Put. Reads prefer Local and hydrate completely verified content on misses. Resource-scoped expiring RWLocks use RLock for Put/Get/upload/download and WLock for GC physical deletion, without long Repository-wide exclusion or duplicate protection mechanisms. Capacity eviction and invalid-orphan reconciliation remain distinct. Phase 6 remains blocked on the specific fencing, queue-transition, remote-verification, capacity, mode-migration, diagnostics, and alternate-backend details listed as Open Items.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 6
      exit_criteria:
        - Local mode runs without constructing, configuring, or contacting GCS
        - GCS Put commits Local, Entry Metadata, and a content-ID transfer-queue item in one MetadataStore atomic operation before asynchronous transfer; SQLite uses the existing Metadata database and a single SQLite transaction
        - MetadataStore exposes backend-neutral atomic Put-and-enqueue and transfer-completion semantics; a Firestore adapter must provide equivalent transaction semantics without SQL leakage
        - unconfirmed queue items are rediscovered after restart, retried idempotently, and marked complete only after remote verification
        - direct resumable upload targets objects/{content_id}, uses no temporary GCS Object or copy, and never overwrites an existing live Object
        - transfer completion is persisted only after the selected remote verification contract passes
        - GCS-mode Get/Cat prefer Local; a miss downloads to shared temporary storage and publishes only complete content verified against its ID
        - Local capacity GC retains unconfirmed content and RLock-protected resources, and evicts only eligible confirmed replicas under a resource WLock
        - invalid-orphan GC protects Metadata references and resource RLocks/WLocks and can eventually collect GCS orphans using generation-conditional deletion
        - a failed capacity reservation returns an error without deleting the last known-good physical Object
        - MetadataStore conformance semantics include atomic revisions, namespace uniqueness, parent validation, and cycle rejection without SQL/API leakage
        - resource RLocks protect Put/Get/upload/download and resource WLocks protect GC physical deletion; lock state is managed atomically in SQLite and no second GC protection mechanism exists
        - Repository coordination is not held during long input, GCS network, download, or response I/O
        - existing Local-only CAS, Get atomic export, Doctor, GC, CLI, and SQLite migration compatibility tests remain covered
  - id: DES-PHASE0-SCAFFOLDING
    level: system_design
    kind: roadmap-phase
    statement: Phase 0 establishes CLI and application/repository boundaries, SQLite metadata, a local Object Store, logical path normalization, and a basic command and test flow.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 0
      phase_status: current
  - id: DES-PHASE7-SYNC
    level: system_design
    kind: roadmap-phase
    statement: Phase 7 sync and remote operation work is deferred until authority, conflict resolution, snapshot boundaries, deletion propagation, offline mutation, authentication, and repository ownership semantics are defined.
    provenance:
      origin: imported
    attributes:
      roadmap_phase: 7
      phase_status: deferred
  - id: DES-CROSS-CUTTING-VALIDATION
    level: system_design
    kind: verification-strategy
    statement: Implementation phases validate Object Store conformance, committed-only Metadata behavior, multi-process Repository interleavings, stable CLI behavior, and each durable failure boundary at the narrowest responsible layer.
    provenance:
      origin: imported
    attributes:
      test_areas:
        - Object Store commit, visibility, verification, idempotency, cleanup, enumeration
        - Metadata committed-only transitions, revisions, conflicts, migrations, rollback
        - Repository Put, replacement, Read, remove, GC interleavings
        - CLI exit-code mapping and data-stream behavior
        - failure injection before Object Commit, between Object and Metadata Commit, and after Metadata Commit
  - id: DES-DEFERRED-OPTIMIZATIONS
    level: system_design
    kind: optimization-boundary
    statement: Hash fan-out tuning, parallel verification, batched GC, GCS listing optimization, additional metadata indexes, content-type detection, remote read caching, and optional per-hash transfer Lease follow correctness work and must not redefine visibility, commit, exclusion, or GC semantics.
    provenance:
      origin: imported
    attributes:
      deferred_optimizations:
        - hash fan-out directory tuning
        - parallel verification
        - batched GC deletion
        - GCS listing optimization
        - metadata indexes beyond observed need
        - content-type detection improvements
        - remote read caching
        - optional per-hash Lease for duplicate-transfer reduction
  - id: DES-PATH-SEMANTICS
    level: system_design
    kind: path-model
    statement: Logical repository paths use forward slashes on every platform, are absolute and normalized by resolving duplicate separators, dot segments, and parent segments, are case-sensitive, and cannot escape the repository root.
    provenance:
      origin: imported

  - id: IMP-CURRENT-LOCAL-ONLY
    level: implementation
    kind: observed-implementation
    statement: At repository revision b4dba45ae202d995c973af01154c08108e98ce1c, CLI composition constructs SQLite MetadataStore and Local ObjectStore only; repository configuration selects a repository directory but has no Local/GCS delivery-mode or bucket selection. GCS methods remain stubs.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/cli/root.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
      - uri: https://github.com/kamichidu/go-nando/blob/b4dba45ae202d995c973af01154c08108e98ce1c/internal/config/config.go
        revision: b4dba45ae202d995c973af01154c08108e98ce1c
        role: implementation-source
