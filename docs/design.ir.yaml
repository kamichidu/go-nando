open_items:
  - id: OPEN-SHA1-FORMAT-TRANSITION
    statement: Decide how repositories with current plain SHA-1 identifiers transition to the Phase 1 SHA-256 algorithm-namespaced format without silently reinterpreting existing IDs.
    status: open
    related_refs: [DES-IDENTITY-TARGET, IMP-CURRENT-SHA1]
  - id: OPEN-READ-REVISION-CHANGE
    statement: Decide whether a Read that observes an Entry revision change during streaming returns the already opened content or retries before exposing bytes; preserve Read/GC exclusion independently of this policy.
    status: open
    related_refs: [DES-READ-SEMANTICS, REQ-READ-GC-EXCLUSION]
  - id: OPEN-PATH-CACHE-UPDATE
    statement: Decide whether a derived canonical path cache is synchronously updated, invalidated for later recalculation, or lazily rebuilt after Entry moves and renames.
    status: open
    related_refs: [DES-EXPLICIT-DIRECTORY-MODEL]
  - id: OPEN-DELETE-RETENTION
    statement: Decide whether removed Entries are represented as tombstones, physically removed, or compacted, and define any retention policy without changing committed namespace visibility semantics.
    status: open
    related_refs: [DES-EXPLICIT-DIRECTORY-MODEL]
  - id: OPEN-REPLICATION-QUEUE-SEMANTICS
    statement: The queue authority and atomic enqueue boundary are decided; it belongs to MetadataStore semantics, SQLite stores it in the existing Metadata database, and Put Entry mutation plus queue insertion share one SQLite transaction. Alternate backends must expose equivalent atomic semantics. Specify queue row fields and state transitions, retry/backoff, and duplicate enqueue/completion semantics while preserving restart rediscovery and no-Pending/no-resume semantics; the semantic API must expose atomic Put-and-enqueue and completion operations without backend transaction types.
    status: open
    related_refs: [REQ-REPLICATION-OBLIGATION, DES-REPLICATION-STATE, DES-METADATA-BACKEND-PORTABILITY]
  - id: OPEN-LEASE-RESOURCE-BINDING
    statement: Decide the Put Stage order and atomic Lease resource transition. The content ID is not known until the shared temporary spool is hashed, while GC must protect both the in-progress temporary path and the completed Local Object; define how the Lease binds a temporary path to its resulting content ID without an unprotected gap, including the create-before-Lease race seen in the current implementation.
    status: open
    related_refs: [REQ-PUT-STAGE-LEASE, DES-PUT-STAGE-COMMIT, DES-RESOURCE-LEASES]
  - id: OPEN-LEASE-EXPIRY-AND-HEARTBEAT
    statement: Define Lease TTL, heartbeat cadence, clock source, renewal error/cancellation behavior, stale worker fencing, and the action when an upload API may finish after renewal failure. Specify how an expired Lease is made terminal and how a late worker is prevented from publishing Local data or recording stale replication state.
    status: open
    related_refs: [DES-RESOURCE-LEASES, DES-REPLICATION-STATE]
  - id: OPEN-LEASE-AND-REMOTE-GC-DELETE
    statement: The resource-scoped RLock/WLock policy resolves the acquisition-versus-GC eligibility race; GC must hold the resource WLock to physically delete, and normal operations hold RLocks. Specify the fencing mechanism that prevents an expired WLock holder from performing a delayed Local or GCS deletion after a newer lock/access is granted. Define the enforceable token/check boundary around filesystem unlink and generation-conditional GCS deletion without holding Repository-wide coordination over long network I/O.
    status: open
    related_refs: [REQ-PUT-GC-EXCLUSION, REQ-READ-GC-EXCLUSION, DES-RESOURCE-LEASES, DES-GC-CLASSES]
  - id: OPEN-GCS-TRANSFER-VERIFICATION
    statement: Define what proves a completed or pre-existing GCS Object contains bytes for its SHA-256 content ID. Choose whether server-validated CRC32C plus the exact spooled upload stream is sufficient, whether a read-back SHA-256 verification is required, or another evidence contract; define treatment of ambiguous completion and verification failure before recording delivery.
    status: open
    related_refs: [REQ-GCS-PUBLICATION, REQ-LOCAL-GCS-IMMUTABILITY, DES-REPLICATION-STATE]
  - id: OPEN-GCS-GENERATION-AND-BUCKET-POLICY
    statement: Define stored GCS generation identity and behavior under bucket versioning, soft delete, retention, external overwrite/delete, bucket/prefix changes, and object recreation. The target requires no-replace publication and generation-conditional deletion, but the rule for noncurrent generations and external actors is not selected.
    status: open
    related_refs: [REQ-GCS-PUBLICATION, REQ-LOCAL-GCS-IMMUTABILITY, DES-GC-CLASSES]
  - id: OPEN-RESUMABLE-UPLOAD-RECOVERY
    statement: Decide whether a resumable GCS upload session URL/offset survives process restart or is discarded and a new resumable session starts from the complete Local Object. Preserve content-ID-level rediscovery and idempotence either way, and do not silently reinterpret this as resuming the original Put operation.
    status: open
    related_refs: [REQ-REPLICATION-OBLIGATION, REQ-NO-RESUME, REQ-GCS-PUBLICATION]
  - id: OPEN-CAPACITY-ADMISSION-AND-LIMITS
    statement: Define capacity scope and admission behavior for the shared Put-spool/download-staging volume, Local object cache, and concurrent operations. Specify reservation accounting, GC trigger, required free-space headroom, concurrent upload/download limits, prioritization, and deterministic capacity errors without allowing GC to remove unconfirmed or RLock-protected content.
    status: open
    related_refs: [REQ-LOCAL-CAPACITY-GC, DES-GC-CLASSES, DES-DELIVERY-MODES]
  - id: OPEN-READ-FAILURE-AND-DOCTOR-SEMANTICS
    statement: Define Doctor health in GCS mode when Local cache is missing/corrupt, replication remains pending, or the GCS Object is missing/corrupt; distinguish valid unreferenced content from invalid orphans without making Doctor destructive. Define Get/Cat behavior if Lease renewal fails or a response writer fails after receiving a prefix; revision-change policy remains independent from GC safety.
    status: open
    related_refs: [REQ-READ-THROUGH, REQ-DOCTOR-NONDESTRUCTIVE, DES-DOCTOR, DES-GCS-READ-THROUGH, OPEN-READ-REVISION-CHANGE]
  - id: OPEN-DELIVERY-CONFIG-AND-MIGRATION
    statement: Decide where repository-owned delivery mode, bucket identity, and backend selection are persisted and whether they belong in Repository Format compatibility metadata or a separate repository configuration. Define initialization, Local-to-GCS prefill and verification, bucket changes, GCS-to-Local recovery, rollback, and behavior for existing repositories without automatic destructive migration.
    status: open
    related_refs: [DES-CONSTRUCTION, DES-DELIVERY-MODES, DES-PHASE1-FORMAT]
  - id: OPEN-FIRESTORE-COORDINATION-AND-SNAPSHOT
    statement: Define the deployment boundary for a Firestore MetadataStore behind MetadataStore semantics. The current SQLite Coordinator is process-wide only for processes sharing one local repository path; decide whether Firestore is limited to that single-host deployment or requires a shared distributed Coordinator and a consistent ReferencedObjectIDs snapshot/conditional GC contract across hosts and writers.
    status: open
    related_refs: [REQ-METADATA-PORTABILITY, REQ-PUT-GC-EXCLUSION, REQ-READ-GC-EXCLUSION, DES-METADATA-BACKEND-PORTABILITY, DES-REPOSITORY-BOUNDARIES]
  - id: OPEN-METADATA-BACKUP-PROCEDURE
    statement: Define operator backup/restore procedure and consistency boundaries for SQLite Metadata, Repository Format, content-ID transfer queue, Local objects, and repository-owned mode configuration; decide which components must be quiesced or backed up as one recoverable set.
    status: open
    related_refs: [REQ-METADATA-BACKUP-RESPONSIBILITY, DES-METADATA-BACKEND-PORTABILITY, DES-REPLICATION-STATE]
