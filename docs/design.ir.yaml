        revision: 9b8b738be3fe0510200e1ff144282f645cc15e19
        role: implementation-source
  - id: IMP-CURRENT-GCS-STUB
    level: implementation
    kind: observed-implementation
    statement: The GCS Object Store package is a placeholder whose operations return ErrNotImplemented.
    provenance:
      origin: observed
    artifact_refs:
      - uri: https://github.com/kamichidu/go-nando/blob/d3a1db2faf961a91908fae5e71620449bc947385/internal/objectstore/gcs/store.go
        revision: d3a1db2faf961a91908fae5e71620449bc947385
        role: implementation-source
  - id: IMP-CURRENT-GET-TRUNCATES
    level: implementation
    kind: observed-implementation
    statement: The inspected Get implementation opens the destination with O_TRUNC and writes directly to it rather than using a temporary destination and atomic replacement.
    provenance:
