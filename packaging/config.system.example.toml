# Copy to /etc/nando/<instance>.toml. The instance must be initialized as
# the packaged nando account before starting nando@<instance>.service.
repository = "/var/lib/nando/<instance>"

# For remote repositories, provide all four scheduler settings explicitly.
# No package or unit defaults are supplied.
[remote]
# sync_idle_interval = "..."
# sync_periodic_interval = "..."
# max_delivery_delay = "..."
# sync_parallelism = 1

[daemon]
endpoint = "unix:///run/nando-<instance>/control.sock"

[recovery]
# directory = "/recyclebin"
