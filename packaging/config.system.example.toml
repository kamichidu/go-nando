# Copy to /etc/nando/<instance>.toml. The instance must be initialized as
# the packaged nando account before starting nando@<instance>.service.
repository = "/var/lib/nando/<instance>"
daemon_endpoint = "unix:///run/nando-<instance>/control.sock"

# For GCS repositories, provide all four scheduler settings explicitly.
# No package or unit defaults are supplied.
# gcs_sync_idle_interval = "..."
# gcs_sync_periodic_interval = "..."
# gcs_max_delivery_delay = "..."
# gcs_sync_parallelism = 1
