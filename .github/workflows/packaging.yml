name: Debian package and system service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            adapters/fuse/go.sum
            adapters/webdav/go.sum
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and inspect Debian package
        run: packaging/check-deb.sh
      - name: Install package and exercise systemd service
        run: |
          package=$(find .build/deb-check -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          python3 packaging/system_service_smoke.py "$package"
