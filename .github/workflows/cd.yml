name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            adapters/fuse/go.sum
            adapters/webdav/go.sum
      - name: Verify committed Go workspace
        run: test "$(go env GOWORK)" = "$GITHUB_WORKSPACE/go.work"
      - name: Wait for successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_ci_run() {
            local runs_json
            runs_json=$(gh api --paginate --slurp \
              "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$TAG_SHA&per_page=100")
            jq -c --arg sha "$TAG_SHA" '
              [.[] | .workflow_runs[]?
                | select(.head_sha == $sha)
                | select(.event == "push")
                | select(.head_branch == "main")
                | {id, status, conclusion, head_sha, head_branch, event}]
              | sort_by(.id) | last // empty
            ' <<<"$runs_json"
          }
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            matching=$(latest_main_ci_run)
            if [[ -n "$matching" ]]; then
              run_id=$(jq -r '.id' <<<"$matching")
              status=$(jq -r '.status' <<<"$matching")
              conclusion=$(jq -r '.conclusion // ""' <<<"$matching")
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" == success ]]; then
                  echo "Main CI run $run_id succeeded for tagged commit $TAG_SHA."
                  exit 0
                fi
                echo "Main CI run $run_id for $TAG_SHA completed with conclusion '$conclusion'; refusing release." >&2
                exit 1
              fi
              echo "Main CI run $run_id for $TAG_SHA is $status; waiting."
            else
              echo "No main push CI run is visible yet for tagged commit $TAG_SHA; waiting."
            fi
            sleep 15
          done
          echo "Timed out after 30 minutes waiting for successful main CI for tagged commit $TAG_SHA." >&2
          exit 1
      - name: Install Debian package tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zip
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build release archives and Debian package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 name=$3 package=$4 module=${5:-.}
            local suffix=""
            [[ "$goos" == windows ]] && suffix=.exe
            if [[ "$module" == . ]]; then
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "dist/$name$suffix" "$package"
            else
              (cd "$module" && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/$name$suffix" "$package")
            fi
          }
          archive() {
            local goos=$1 goarch=$2; shift 2
            local staging="dist/staging-$goos-$goarch"
            mkdir -p "$staging"
            for item in "$@"; do cp "dist/$item" "$staging/"; done
            cp README.adoc LICENSE "$staging/"
            local base="nando_${VERSION}_${goos}_${goarch}"
            if [[ "$goos" == windows ]]; then
              (cd "$staging" && zip -q -r "../$base.zip" .)
            else
              tar -C "$staging" -czf "dist/$base.tar.gz" .
            fi
            rm -rf "$staging"
            rm -f dist/nando dist/nando-fuse dist/nando-webdav dist/nando.exe dist/nando-webdav.exe
          }
          for arch in amd64 arm64; do
            build linux "$arch" nando ./cmd/nando
            build linux "$arch" nando-fuse ./cmd/nando-fuse adapters/fuse
            build linux "$arch" nando-webdav ./cmd/nando-webdav adapters/webdav
            archive linux "$arch" nando nando-fuse nando-webdav
          done
          for arch in amd64 arm64; do
            build darwin "$arch" nando ./cmd/nando
            build darwin "$arch" nando-webdav ./cmd/nando-webdav adapters/webdav
            archive darwin "$arch" nando nando-webdav
            build windows "$arch" nando ./cmd/nando
            build windows "$arch" nando-webdav ./cmd/nando-webdav adapters/webdav
            archive windows "$arch" nando.exe nando-webdav.exe
          done
          mkdir -p .build/deb
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o .build/deb/nando ./cmd/nando
          (cd adapters/fuse && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/.build/deb/nando-fuse" ./cmd/nando-fuse)
          (cd adapters/webdav && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/.build/deb/nando-webdav" ./cmd/nando-webdav)
          sed \
            -e "s|\${VERSION}|$VERSION|g" \
            -e "s|\${BUILD_DIR}|$GITHUB_WORKSPACE/.build/deb|g" \
            -e 's|\${NFPM_ARCH}|amd64|g' \
            packaging/nfpm.yaml > .build/deb/nfpm.yaml
          nfpm package --config .build/deb/nfpm.yaml --packager deb --target "$GITHUB_WORKSPACE/dist"
          PACKAGE=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$PACKAGE"
          dpkg-deb --contents "$PACKAGE"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
