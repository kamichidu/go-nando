name: Interface benchmark (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Local RPC, WebDAV, and optional FUSE
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            go.sum
            adapters/fuse/go.sum
            adapters/webdav/go.sum
      - name: Capture runner and tool versions
        run: |
          set -euo pipefail
          mkdir -p results
          {
            echo "UTC start: $(date -u +%FT%TZ)"
            echo "Runner OS: ${RUNNER_OS:-unknown}"
            echo "Runner arch: ${RUNNER_ARCH:-unknown}"
            echo "Image OS: ${ImageOS:-unknown}"
            echo "Image version: ${ImageVersion:-unknown}"
            uname -a
            lscpu
            df -T "$GITHUB_WORKSPACE"
            go version
            python3 --version
            git --version
          } > results/runner-details.txt 2>&1
          cat results/runner-details.txt
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nando-bin"
          go build -trimpath -o "$RUNNER_TEMP/nando-bin/nando" ./cmd/nando
          (cd adapters/webdav && go build -trimpath -o "$RUNNER_TEMP/nando-bin/nando-webdav" ./cmd/nando-webdav)
          (cd adapters/fuse && go build -trimpath -o "$RUNNER_TEMP/nando-bin/nando-fuse" ./cmd/nando-fuse)
          "$RUNNER_TEMP/nando-bin/nando" --help > results/nando-help.txt 2>&1 || true
      - name: Run reproducible local interface benchmarks
        id: run
        run: |
          set -uo pipefail
          ART="$GITHUB_WORKSPACE/results/benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BIN="$RUNNER_TEMP/nando-bin"
          mkdir -p "$ART" "$RUNNER_TEMP/nando-bench/repository" "$RUNNER_TEMP/nando-bench/mount"
          REPO="$RUNNER_TEMP/nando-bench/repository"
          SOCK="$RUNNER_TEMP/nando-bench/nando.sock"
          WEBDAV_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          WEBDAV_URL="http://127.0.0.1:$WEBDAV_PORT"
          CONDITIONS="$ART/run-conditions.json"
          cat > "$CONDITIONS" <<JSON
          {
            "delivery_mode": "local",
            "cache_state": "unique random paths; read immediately after write; host page cache not cleared",
            "storage": "ubuntu-latest hosted runner workspace filesystem (see runner-details.txt)",
            "repository_filesystem": "runner workspace filesystem",
            "other_workload": "no intentional concurrent workload; shared hosted runner contention is uncontrolled",
            "mount_options": [],
            "webdav_url": "$WEBDAV_URL",
            "comparison_note": "End-to-end operation observations include protocol/client/kernel/daemon/storage paths. Cross-interface deltas do not isolate adapter-only overhead."
          }
          JSON
          echo '{"schema_version":1,"warmup_iterations":10,"measured_iterations":100,"payload_bytes":4096,"interfaces":{}}' > "$ART/manifest.json"
          cleanup() {
            set +e
            if [[ -n "${FUSE_PID:-}" ]]; then
              fusermount3 -u "$RUNNER_TEMP/nando-bench/mount" 2>>"$ART/cleanup.log" || fusermount -u "$RUNNER_TEMP/nando-bench/mount" 2>>"$ART/cleanup.log" || true
              kill "$FUSE_PID" 2>/dev/null || true
              wait "$FUSE_PID" 2>/dev/null || true
            fi
            if [[ -n "${WEBDAV_PID:-}" ]]; then kill "$WEBDAV_PID" 2>/dev/null || true; wait "$WEBDAV_PID" 2>/dev/null || true; fi
            if [[ -n "${DAEMON_PID:-}" ]]; then kill "$DAEMON_PID" 2>/dev/null || true; wait "$DAEMON_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          fail=0
          "$BIN/nando" --repository "$REPO" init --delivery-mode local >"$ART/init.log" 2>&1 || { echo 'Repository initialization failed' | tee "$ART/failure.txt"; fail=1; }
          if (( fail == 0 )); then
            "$BIN/nando" --repository "$REPO" --daemon-listen "unix://$SOCK" daemon >"$ART/daemon.log" 2>&1 & DAEMON_PID=$!
            for _ in $(seq 1 100); do [[ -S "$SOCK" ]] && break; kill -0 "$DAEMON_PID" 2>/dev/null || break; sleep 0.1; done
            if [[ ! -S "$SOCK" ]]; then echo 'Daemon socket did not become ready' | tee "$ART/failure.txt"; fail=1; fi
          fi
          if (( fail == 0 )); then
            run_one() {
              local interface=$1; shift
              local warm="$ART/${interface}-warmup.json" raw="$ART/${interface}.json"
              python3 tools/interface_benchmark.py --interface "$interface" --output "$warm" --iterations 10 --payload-bytes 4096 --run-conditions "$CONDITIONS" "$@" >"$ART/${interface}-warmup.stdout" 2>"$ART/${interface}-warmup.stderr" || { echo "$interface warmup/functional check failed" | tee -a "$ART/failure.txt"; fail=1; }
              python3 tools/interface_benchmark.py --interface "$interface" --output "$raw" --iterations 100 --payload-bytes 4096 --run-conditions "$CONDITIONS" "$@" >"$ART/${interface}.stdout" 2>"$ART/${interface}.stderr" || { echo "$interface measured run failed" | tee -a "$ART/failure.txt"; fail=1; }
              python3 - "$raw" "$interface" "$ART/manifest.json" <<'PY'
          import json, pathlib, sys
          raw, interface, manifest = map(pathlib.Path, sys.argv[1:])
          data = json.loads(raw.read_text()) if raw.exists() else {"status": "launch_failed", "errors": []}
          m = json.loads(manifest.read_text())
          m["interfaces"][interface] = {"status": data.get("status", "missing"), "completed": data.get("completed", 0), "failed": data.get("failed", 0), "json": raw.name}
          manifest.write_text(json.dumps(m, indent=2) + "\n")
          PY
            }
            run_one rpc --rpc-endpoint "unix://$SOCK"
            "$BIN/nando-webdav" --repository "$REPO" --daemon-listen "unix://$SOCK" --webdav-listen "127.0.0.1:$WEBDAV_PORT" >"$ART/webdav-server.log" 2>&1 & WEBDAV_PID=$!
            for _ in $(seq 1 100); do curl --connect-timeout 1 --max-time 2 --silent --fail "$WEBDAV_URL/" -o /dev/null && break; kill -0 "$WEBDAV_PID" 2>/dev/null || break; sleep 0.1; done
            if ! kill -0 "$WEBDAV_PID" 2>/dev/null || ! curl --connect-timeout 1 --max-time 2 --silent --output /dev/null "$WEBDAV_URL/"; then echo 'WebDAV server failed preflight' | tee -a "$ART/failure.txt"; fail=1; else run_one webdav --webdav-url "$WEBDAV_URL"; fi
            {
              echo "device: $(test -e /dev/fuse && echo present || echo absent)"
              ls -l /dev/fuse 2>&1 || true
              echo "uid: $(id -u) groups: $(id -Gn)"
              command -v fusermount3 || command -v fusermount || true
            } > "$ART/fuse-preflight.txt"
            if [[ -c /dev/fuse && -r /dev/fuse && -w /dev/fuse ]] && { command -v fusermount3 >/dev/null || command -v fusermount >/dev/null; }; then
              "$BIN/nando-fuse" --repository "$REPO" --daemon-listen "unix://$SOCK" --fuse-mountpoint "$RUNNER_TEMP/nando-bench/mount" >"$ART/fuse-server.log" 2>&1 & FUSE_PID=$!
              mounted=0
              for _ in $(seq 1 100); do mountpoint -q "$RUNNER_TEMP/nando-bench/mount" && { mounted=1; break; }; kill -0 "$FUSE_PID" 2>/dev/null || break; sleep 0.1; done
              if (( mounted )); then run_one fuse --mountpoint "$RUNNER_TEMP/nando-bench/mount"; else echo 'SKIP: /dev/fuse access existed but the actual mount preflight failed; hosted runner does not support this FUSE mount' | tee "$ART/fuse-status.txt"; kill "$FUSE_PID" 2>/dev/null || true; wait "$FUSE_PID" 2>/dev/null || true; FUSE_PID=; fi
            else
              echo 'SKIP: /dev/fuse is absent or not readable/writable by the runner, or fusermount helper is unavailable' | tee "$ART/fuse-status.txt"
            fi
          fi
          python3 - "$ART" <<'PY'
          import csv, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          rows=[]
          for path in sorted(root.glob('*.json')):
              if path.name in ('manifest.json','run-conditions.json') or 'warmup' in path.name: continue
              data=json.loads(path.read_text())
              for item in data.get('iterations',[]):
                  for operation, elapsed in item.get('operations',{}).items():
                      rows.append({'interface':data.get('interface'), 'iteration':item.get('iteration'), 'status':item.get('status'), 'operation':operation, 'duration_ns':elapsed, 'payload_bytes':item.get('payload_bytes')})
          with (root/'samples.csv').open('w', newline='') as f:
              w=csv.DictWriter(f, fieldnames=['interface','iteration','status','operation','duration_ns','payload_bytes']); w.writeheader(); w.writerows(rows)
          with (root/'summary.md').open('w') as f:
              f.write('# Interface benchmark summary\n\n')
              f.write('Scope: end-to-end adapter/protocol observations; cross-interface latency deltas do not isolate adapter-only overhead. No performance threshold is applied.\n\n')
              f.write('Conditions: 10 warmup iterations and 100 measured iterations per available interface; 4096-byte payload; unique paths; local delivery; localhost; host caches not cleared.\n\n')
              for p in sorted(root.glob('*.json')):
                  if p.name in ('manifest.json','run-conditions.json') or 'warmup' in p.name: continue
                  d=json.loads(p.read_text()); f.write(f"## {d.get('interface','unknown')}: {d.get('status','missing')}\n\nSuccessful {d.get('completed',0)}, failed {d.get('failed',0)}.\n\n")
                  for op, stats in d.get('summary_successful_iterations',{}).items(): f.write(f"- {op}: median {stats['median_ns']} ns, p95 {stats['p95_ns']} ns, p99 {stats['p99_ns']} ns ({stats['samples']} samples)\n")
              skip=root/'fuse-status.txt'
              if skip.exists(): f.write('\n## FUSE\n\n'+skip.read_text()+'\n')
              fail=root/'failure.txt'
              if fail.exists(): f.write('\n## Functional failures\n\n'+fail.read_text()+'\n')
          PY
          python3 - "$ART" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])/'manifest.json'; d=json.loads(p.read_text())
          d['finished_at_utc']=__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          echo "artifact_dir=$ART" >> "$GITHUB_OUTPUT"
          exit "$fail"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/runner-details.txt
            results/nando-help.txt
            results/benchmark-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30
